<!DOCTYPE html>
<html lang="mai">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>मैथिली समाचार</title>

<meta
  name="description"
  content="मैथिली भाषामे नवीनतम समाचार, मिथिला, बिहार आ देश-विदेशक समाचार।"
>

<meta
  name="robots"
  content="index, follow"
>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font-family:inherit;
}

button:focus-visible,
a:focus-visible,
input:focus-visible{
  outline:2px solid #ffb000;
  outline-offset:2px;
}

.container{
  width:min(1200px,94%);
  margin:auto;
}


/* =====================================================
   HEADER
===================================================== */

.top-header{
  background:#8b0000;
  color:white;
}

.header-main{
  padding:18px 0;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:30px;
  font-weight:800;
  line-height:1.2;
}

.tagline{
  font-size:14px;
  opacity:.9;
  margin-top:5px;
}

.admin-link{
  background:white;
  color:#8b0000;
  padding:9px 14px;
  border-radius:7px;
  font-size:13px;
  font-weight:bold;
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav{
  background:#650000;
  color:white;
}

.nav-inner{
  display:flex;
  align-items:center;
  gap:4px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  min-height:46px;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:10px 15px;
  border-radius:5px;
  white-space:nowrap;
  flex:0 0 auto;
  color:white;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.nav-link:hover,
.nav-link.active{
  background:rgba(255,255,255,.16);
}

.nav-loading{
  padding:10px 15px;
  color:rgba(255,255,255,.7);
  font-size:13px;
  white-space:nowrap;
}


/* =====================================================
   SEARCH
===================================================== */

.search-section{
  padding:18px 0;
  background:white;
  border-bottom:1px solid #ddd;
}

.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  flex:1;
  min-width:0;
  height:46px;
  padding:0 14px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.search-box button{
  min-width:90px;
  border:0;
  background:#8b0000;
  color:white;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  padding:0 20px;
}


/* =====================================================
   MAIN
===================================================== */

main{
  padding:25px 0 60px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.section-title h1{
  margin:0;
  font-size:24px;
}

.section-title span{
  color:#777;
  font-size:14px;
}


/* =====================================================
   FEATURED
===================================================== */

.featured-grid{
  display:grid;
  grid-template-columns:
    minmax(0,2fr)
    minmax(280px,1fr);
  gap:20px;
  margin-bottom:30px;
}

.featured-main,
.featured-side{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:
    0 2px 12px rgba(0,0,0,.08);
}

.featured-main img{
  width:100%;
  height:330px;
  object-fit:cover;
  display:block;
}

.featured-content{
  padding:18px;
}

.featured-content .category{
  margin-bottom:8px;
}

.featured-title{
  font-size:27px;
  line-height:1.35;
  margin:0 0 10px;
}

.featured-summary{
  color:#666;
  line-height:1.7;
  margin:0;
}

.featured-side{
  display:flex;
  flex-direction:column;
}

.featured-side-item{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:12px;
  padding:12px;
  border-bottom:1px solid #eee;
}

.featured-side-item:last-child{
  border-bottom:0;
}

.featured-side-item img,
.featured-side-image{
  width:110px;
  height:80px;
  object-fit:cover;
  border-radius:7px;
}

.featured-side-title{
  font-size:15px;
  line-height:1.45;
  font-weight:700;
}


/* =====================================================
   NEWS GRID
===================================================== */

.news-grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:20px;
}

.news-card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:
    0 2px 10px rgba(0,0,0,.07);
  transition:
    transform .2s,
    box-shadow .2s;
}

.news-card:hover{
  transform:translateY(-3px);
  box-shadow:
    0 6px 20px rgba(0,0,0,.13);
}

.news-card-link{
  display:block;
  height:100%;
}

.news-image,
.no-image{
  width:100%;
  height:200px;
}

.news-image{
  object-fit:cover;
  display:block;
  background:#eee;
}

.no-image{
  background:
    linear-gradient(
      135deg,
      #eee,
      #ddd
    );
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
}

.news-body{
  padding:16px;
}

.category{
  display:inline-block;
  color:#8b0000;
  font-size:12px;
  font-weight:bold;
  margin-bottom:8px;
}

.news-title{
  font-size:19px;
  line-height:1.4;
  margin:0 0 9px;
}

.news-summary{
  color:#666;
  font-size:14px;
  line-height:1.6;
  margin:0 0 12px;
}

.news-tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:12px;
}

.news-tag{
  color:#8b0000;
  background:#fff1f1;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
}

.news-meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#888;
  font-size:12px;
  border-top:1px solid #eee;
  padding-top:10px;
}


/* =====================================================
   STATES
===================================================== */

.loading,
.empty,
.error{
  background:white;
  padding:40px 20px;
  text-align:center;
  border-radius:10px;
  color:#777;
}

.error{
  color:#a00000;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  background:#222;
  color:white;
  padding:30px 0;
  text-align:center;
}

footer p{
  margin:6px 0;
  color:#bbb;
  font-size:13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

  .news-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .featured-grid{
    grid-template-columns:1fr;
  }

}


@media(max-width:600px){

  .container{
    width:92%;
  }

  .header-main{
    padding:14px 0;
  }

  .header-inner{
    align-items:flex-start;
  }

  .logo{
    font-size:24px;
  }

  .tagline{
    font-size:12px;
  }

  .admin-link{
    display:none;
  }

  .nav-link{
    min-height:44px;
    padding:10px 12px;
    font-size:13px;
  }

  .search-section{
    padding:12px 0;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box input{
    width:100%;
  }

  .search-box button{
    width:100%;
    height:44px;
  }

  main{
    padding:18px 0 40px;
  }

  .section-title{
    align-items:flex-start;
    flex-direction:column;
    gap:5px;
  }

  .section-title h1{
    font-size:21px;
  }

  .news-grid{
    grid-template-columns:1fr;
    gap:15px;
  }

  .news-image,
  .no-image{
    height:210px;
  }

  .featured-main img{
    height:230px;
  }

  .featured-title{
    font-size:22px;
  }

  .featured-side-item{
    grid-template-columns:95px 1fr;
  }

  .featured-side-item img,
  .featured-side-image{
    width:95px;
    height:75px;
  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

  .logo{
    font-size:22px;
  }

  .news-title{
    font-size:18px;
  }

  .news-body{
    padding:14px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

  <div class="header-main">

    <div class="container header-inner">

      <div>

        <div class="logo">
          मैथिली समाचार
        </div>

        <div class="tagline">
          मैथिली भाषामे नवीनतम समाचार
        </div>

      </div>


      <a
        href="/admin.html"
        class="admin-link"
      >
        Admin Login
      </a>

    </div>

  </div>


  <!-- ===================================================
       CATEGORY MENU
  ==================================================== -->

  <nav class="nav">

    <div
      class="container nav-inner"
      id="categoryNav"
    >

      <a
        href="/"
        class="nav-link active"
        data-category=""
      >
        सभ समाचार
      </a>

      <span
        class="nav-loading"
        id="categoryNavLoading"
      >
        श्रेणी लोड भ' रहल अछि...
      </span>

    </div>

  </nav>

</header>


<!-- =====================================================
     SEARCH
===================================================== -->

<section class="search-section">

  <div class="container">

    <form
      class="search-box"
      id="searchForm"
    >

      <input
        type="search"
        id="searchInput"
        placeholder="समाचार खोजू..."
        autocomplete="off"
      >

      <button type="submit">
        खोजू
      </button>

    </form>

  </div>

</section>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

  <div class="container">


    <!-- FEATURED -->

    <section
      id="featuredSection"
      style="display:none"
    >

      <div class="section-title">

        <h1>
          प्रमुख समाचार
        </h1>

      </div>

      <div
        id="featuredContainer"
        class="featured-grid"
      ></div>

    </section>


    <!-- NEWS -->

    <div class="section-title">

      <h1 id="sectionTitle">
        नवीनतम समाचार
      </h1>

      <span id="newsCount">
        0 समाचार
      </span>

    </div>


    <div
      id="newsContainer"
      class="news-grid"
    >

      <div
        class="loading"
        style="grid-column:1/-1"
      >
        समाचार लोड भ' रहल अछि...
      </div>

    </div>

  </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  <div class="container">

    <strong>
      मैथिली समाचार
    </strong>

    <p>
      मैथिली भाषामे समाचार आ जानकारी।
    </p>

    <p>
      ©
      <span id="year"></span>
      मैथिली समाचार
    </p>

  </div>

</footer>


<script>

/* ======================================================
   GLOBAL
====================================================== */

let allNews = [];

let categories = [];

let currentCategorySlug = "";


/* ======================================================
   START
====================================================== */

document.addEventListener(
  "DOMContentLoaded",
  start
);


async function start(){

  document
    .getElementById("year")
    .textContent =
    new Date().getFullYear();


  document
    .getElementById("searchForm")
    .addEventListener(
      "submit",
      function(event){

        event.preventDefault();

        performSearch();

      }
    );


  await loadCategories();

  await loadNews();

}


/* ======================================================
   LOAD CATEGORIES
====================================================== */

async function loadCategories(){

  try{

    const response =
      await fetch(
        "/api/categories?status=active",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !data.success
    ){

      throw new Error(
        data.error ||
        "श्रेणी लोड नहि भ' सकल"
      );

    }


    categories =
      (data.categories || [])
        .filter(
          category =>
            String(
              category.status ||
              "active"
            ).toLowerCase()
            === "active"
        )
        .filter(
          category =>
            Number(
              category.menu_visible ??
              category.show_in_menu ??
              1
            ) === 1
        )
        .sort(
          (a,b) =>
            Number(
              a.menu_order || 0
            ) -
            Number(
              b.menu_order || 0
            )
        );


    renderCategoryMenu();


    setActiveCategory();


  }catch(error){

    console.error(
      "CATEGORY ERROR:",
      error
    );


    const loading =
      document.getElementById(
        "categoryNavLoading"
      );


    if(loading){

      loading.textContent =
        "श्रेणी उपलब्ध नहि अछि";

    }

  }

}


/* ======================================================
   RENDER CATEGORY MENU
====================================================== */

function renderCategoryMenu(){

  const nav =
    document.getElementById(
      "categoryNav"
    );


  const loading =
    document.getElementById(
      "categoryNavLoading"
    );


  if(loading){
    loading.remove();
  }


  categories.forEach(
    category => {

      if(!category.slug){
        return;
      }


      const link =
        document.createElement(
          "a"
        );


      link.className =
        "nav-link";


      link.href =
        "/category/" +
        encodeURIComponent(
          category.slug
        );


      link.textContent =
        category.name;


      link.dataset.category =
        category.slug;


      nav.appendChild(
        link
      );

    }
  );

}


/* ======================================================
   ACTIVE CATEGORY
====================================================== */

function setActiveCategory(){

  const path =
    location.pathname
      .replace(
        /\/+$/,
        ""
      );


  document
    .querySelectorAll(
      "#categoryNav .nav-link"
    )
    .forEach(
      link => {

        link.classList.remove(
          "active"
        );


        const href =
          link.getAttribute(
            "href"
          );


        if(
          path ===
          href.replace(
            /\/+$/,
            ""
          )
        ){

          link.classList.add(
            "active"
          );

        }

      }
    );

}


/* ======================================================
   LOAD NEWS
====================================================== */

async function loadNews(){

  const container =
    document.getElementById(
      "newsContainer"
    );


  container.innerHTML =
    `
      <div
        class="loading"
        style="grid-column:1/-1"
      >
        समाचार लोड भ' रहल अछि...
      </div>
    `;


  try{

    const response =
      await fetch(
        "/api/news?status=published&limit=50",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !data.success
    ){

      throw new Error(
        data.error ||
        "समाचार लोड नहि भ' सकल"
      );

    }


    allNews =
      data.news || [];


    renderFeatured(
      allNews
    );


    renderNews(
      allNews
    );


  }catch(error){

    console.error(
      "NEWS ERROR:",
      error
    );


    container.innerHTML =
      `
        <div
          class="error"
          style="grid-column:1/-1"
        >
          समाचार लोड नहि भ' सकल।
          <br>
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

  }

}


/* ======================================================
   FEATURED NEWS
====================================================== */

function renderFeatured(
  news
){

  const featured =
    news.filter(
      item =>
        Number(
          item.featured || 0
        ) === 1
    );


  const section =
    document.getElementById(
      "featuredSection"
    );


  const container =
    document.getElementById(
      "featuredContainer"
    );


  if(
    !featured.length
  ){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  const main =
    featured[0];


  const side =
    featured
      .slice(1,4);


  container.innerHTML =
    `
      <a
        class="featured-main"
        href="/news/${encodeURIComponent(
          main.slug || main.id
        )}"
      >

        ${
          main.image_url

          ? `
            <img
              src="${escapeAttribute(
                main.image_url
              )}"
              alt="${escapeAttribute(
                main.title
              )}"
              loading="lazy"
            >
          `

          : `
            <div
              class="no-image"
              style="height:330px"
            >
              मैथिली समाचार
            </div>
          `
        }


        <div class="featured-content">

          <div class="category">
            ${escapeHtml(
              main.category_name ||
              "समाचार"
            )}
          </div>


          <h2 class="featured-title">
            ${escapeHtml(
              main.title
            )}
          </h2>


          <p class="featured-summary">
            ${escapeHtml(
              main.summary ||
              makeExcerpt(
                main.content,
                220
              )
            )}
          </p>

        </div>

      </a>


      <div class="featured-side">

        ${
          side.length

          ? side
              .map(
                item =>
                  `
                    <a
                      class="featured-side-item"
                      href="/news/${encodeURIComponent(
                        item.slug ||
                        item.id
                      )}"
                    >

                      ${
                        item.image_url

                        ? `
                          <img
                            src="${escapeAttribute(
                              item.image_url
                            )}"
                            alt="${escapeAttribute(
                              item.title
                            )}"
                            loading="lazy"
                          >
                        `

                        : `
                          <div
                            class="featured-side-image no-image"
                          >
                            समाचार
                          </div>
                        `
                      }


                      <div>

                        <div
                          class="category"
                        >
                          ${escapeHtml(
                            item.category_name ||
                            "समाचार"
                          )}
                        </div>


                        <div
                          class="featured-side-title"
                        >
                          ${escapeHtml(
                            item.title
                          )}
                        </div>

                      </div>

                    </a>
                  `
              )
              .join("")

          : `
            <div
              class="empty"
              style="height:100%"
            >
              अन्य प्रमुख समाचार
            </div>
          `
        }

      </div>
    `;

}


/* ======================================================
   FILTER / SEARCH
====================================================== */

function performSearch(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(query){

    document
      .getElementById(
        "sectionTitle"
      )
      .textContent =
      "खोज परिणाम";

  }else{

    document
      .getElementById(
        "sectionTitle"
      )
      .textContent =
      "नवीनतम समाचार";

  }


  let filtered =
    [...allNews];


  if(
    currentCategorySlug
  ){

    filtered =
      filtered.filter(
        news =>
          String(
            news.category_slug ||
            ""
          ).toLowerCase()
          ===
          currentCategorySlug
            .toLowerCase()
      );

  }


  if(query){

    filtered =
      filtered.filter(
        news => {

          const title =
            String(
              news.title || ""
            )
              .toLowerCase();


          const summary =
            String(
              news.summary || ""
            )
              .toLowerCase();


          const content =
            String(
              news.content || ""
            )
              .toLowerCase();


          const tags =
            (news.tags || [])
              .map(
                tag =>
                  String(
                    tag.name ||
                    tag.slug ||
                    ""
                  ).toLowerCase()
              )
              .join(" ");


          return (
            title.includes(query) ||
            summary.includes(query) ||
            content.includes(query) ||
            tags.includes(query)
          );

        }
      );

  }


  renderNews(
    filtered
  );

}


/* ======================================================
   RENDER NEWS
====================================================== */

function renderNews(
  news
){

  const container =
    document.getElementById(
      "newsContainer"
    );


  document
    .getElementById(
      "newsCount"
    )
    .textContent =
      news.length +
      " समाचार";


  if(
    !news.length
  ){

    container.innerHTML =
      `
        <div
          class="empty"
          style="grid-column:1/-1"
        >
          एहि खोज/श्रेणी में
          कोनो समाचार नहि भेटल।
        </div>
      `;

    return;

  }


  container.innerHTML =
    news
      .map(
        item =>
          createNewsCard(
            item
          )
      )
      .join("");

}


/* ======================================================
   NEWS CARD
====================================================== */

function createNewsCard(
  news
){

  const slug =
    news.slug ||
    news.id;


  const image =
    news.image_url

    ? `
      <img
        class="news-image"
        src="${escapeAttribute(
          news.image_url
        )}"
        alt="${escapeAttribute(
          news.title
        )}"
        loading="lazy"
        onerror="
          this.outerHTML =
          '<div class=&quot;no-image&quot;>मैथिली समाचार</div>'
        "
      >
    `

    : `
      <div class="no-image">
        मैथिली समाचार
      </div>
    `;


  const summary =
    news.summary ||
    makeExcerpt(
      news.content,
      150
    );


  const tags =
    Array.isArray(
      news.tags
    )
      ? news.tags
      : [];


  const tagsHtml =
    tags.length

      ? `
        <div class="news-tags">

          ${
            tags
              .slice(0,4)
              .map(
                tag =>
                  `
                    <span
                      class="news-tag"
                    >
                      #${escapeHtml(
                        tag.name ||
                        tag.slug
                      )}
                    </span>
                  `
              )
              .join("")
          }

        </div>
      `

      : "";


  return `
    <article class="news-card">

      <a
        class="news-card-link"
        href="/news/${encodeURIComponent(
          slug
        )}"
      >

        ${image}


        <div class="news-body">

          <div class="category">
            ${escapeHtml(
              news.category_name ||
              "समाचार"
            )}
          </div>


          <h2 class="news-title">
            ${escapeHtml(
              news.title
            )}
          </h2>


          <p class="news-summary">
            ${escapeHtml(
              summary
            )}
          </p>


          ${tagsHtml}


          <div class="news-meta">

            <span>
              ${formatDate(
                news.published_at ||
                news.created_at
              )}
            </span>


            <span>
              👁
              ${Number(
                news.views || 0
              )}
            </span>

          </div>

        </div>

      </a>

    </article>
  `;

}


/* ======================================================
   EXCERPT
====================================================== */

function makeExcerpt(
  text,
  length
){

  const clean =
    String(
      text || ""
    )
      .replace(
        /<[^>]*>/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if(
    clean.length <= length
  ){

    return clean;

  }


  return (
    clean.substring(
      0,
      length
    ) +
    "..."
  );

}


/* ======================================================
   DATE
====================================================== */

function formatDate(
  value
){

  if(!value){
    return "";
  }


  try{

    return new Date(
      value
    ).toLocaleDateString(
      "hi-IN",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  }catch{

    return "";

  }

}


/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ======================================================
   ESCAPE ATTRIBUTE
====================================================== */

function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}
