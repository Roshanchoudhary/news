<!DOCTYPE html>
<html lang="mai">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>मैथिली समाचार</title>

  <meta
    name="description"
    content="मैथिली भाषामे नवीनतम समाचार"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family:
        Arial,
        "Noto Sans Devanagari",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #8b0000;
      outline-offset: 2px;
    }

    .container {
      width: min(1200px, 94%);
      margin: auto;
    }

    /* HEADER */

    .top-header {
      background: #8b0000;
      color: white;
    }

    .header-main {
      padding: 18px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
    }

    .tagline {
      font-size: 14px;
      opacity: .9;
      margin-top: 4px;
    }

    .admin-link {
      background: white;
      color: #8b0000;
      padding: 8px 13px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    /* NAV */

    .nav {
      background: #650000;
      color: white;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      min-height: 44px;
    }

    .nav-inner::-webkit-scrollbar {
      display: none;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      flex: 0 0 auto;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255,255,255,.15);
    }

    .nav-loading {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 15px;
      color: rgba(255,255,255,.75);
      white-space: nowrap;
      font-size: 13px;
    }

    /* SEARCH */

    .search-section {
      padding: 20px 0;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
      font-family: inherit;
    }

    .search-box button {
      border: 0;
      background: #8b0000;
      color: white;
      padding: 0 20px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    /* MAIN */

    main {
      padding: 25px 0 60px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 23px;
    }

    .section-title span {
      color: #777;
      font-size: 14px;
    }

    /* NEWS GRID */

    .news-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .news-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 2px 10px rgba(0,0,0,.07);
      transition:
        transform .2s,
        box-shadow .2s;
    }

    .news-card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 5px 18px rgba(0,0,0,.12);
    }

    .news-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #e9e9e9;
      display: block;
    }

    .no-image {
      width: 100%;
      height: 200px;
      background:
        linear-gradient(
          135deg,
          #eee,
          #ddd
        );
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 14px;
    }

    .news-body {
      padding: 16px;
    }

    .category {
      display: inline-block;
      color: #8b0000;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .news-title {
      font-size: 19px;
      line-height: 1.4;
      margin: 0 0 9px;
    }

    .news-summary {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 12px;
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 12px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    /* EMPTY */

    .loading,
    .empty,
    .error {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 10px;
      color: #777;
    }

    .error {
      color: #a00000;
    }

    /* FOOTER */

    footer {
      background: #222;
      color: white;
      padding: 30px 0;
      text-align: center;
    }

    footer p {
      margin: 5px 0;
      color: #bbb;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .news-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 600px) {

      .nav-link {
        padding: 10px 12px;
        font-size: 13px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        min-height: 44px;
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .logo {
        font-size: 25px;
      }

      .admin-link {
        display: none;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-image,
      .no-image {
        height: 210px;
      }

      .search-box button {
        padding: 0 15px;
      }

    }

  </style>
</head>

<body>


<!-- =========================================
     HEADER
========================================== -->

<header class="top-header">

  <div class="header-main">

    <div class="container header-inner">

      <div>

        <div class="logo">
          मैथिली समाचार
        </div>

        <div class="tagline">
          मैथिली भाषामे नवीनतम समाचार
        </div>

      </div>

      <a
        href="/admin.html"
        class="admin-link"
      >
        Admin Login
      </a>

    </div>

  </div>


  <!-- NAVIGATION -->

  <nav class="nav">
  <div class="container nav-inner" id="categoryNav">
    <a class="nav-link active" href="/" data-category="">
      सभ समाचार
    </a>
    <span class="nav-loading" id="categoryNavLoading">श्रेणी लोड भ' रहल अछि...</span>
  </div>
</nav>

</header>


<!-- =========================================
     SEARCH
========================================== -->

<section class="search-section">

  <div class="container">

    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        placeholder="समाचार खोजू..."
        autocomplete="off"
      >

      <button
        type="button"
        id="searchButton"
      >
        खोजू
      </button>

    </div>

  </div>

</section>


<!-- =========================================
     MAIN
========================================== -->

<main>

  <div class="container">


    <div class="section-title">

      <h2 id="sectionTitle">
        नवीनतम समाचार
      </h2>

      <span id="newsCount">
        0 समाचार
      </span>

    </div>


    <div
      id="newsContainer"
      class="news-grid"
    >

      <div
        class="loading"
        style="grid-column:1/-1"
      >
        समाचार लोड भ' रहल अछि...
      </div>

    </div>

  </div>

</main>


<!-- =========================================
     FOOTER
========================================== -->

<footer>

  <div class="container">

    <strong>
      मैथिली समाचार
    </strong>

    <p>
      मैथिली भाषामे समाचार आ जानकारी।
    </p>

    <p>
      © <span id="year"></span>
      मैथिली समाचार
    </p>

  </div>

</footer>


<script>



// =====================================================
// LEGACY NEWS URL REDIRECT
// =====================================================

(function redirectLegacyNewsUrl() {

  const path =
    location.pathname;

  if (
    path !== "/news.html" &&
    path !== "/news"
  ) {
    return;
  }

  const id =
    new URLSearchParams(
      location.search
    ).get("id");

  if (!id) {
    return;
  }

  fetch(
    "/api/news?id=" +
    encodeURIComponent(id),
    {
      cache: "no-store"
    }
  )
  .then(
    response =>
      response.json()
  )
  .then(
    data => {

      if (
        data.success &&
        data.news &&
        data.news.slug
      ) {

        location.replace(
          "/news/" +
          encodeURIComponent(
            data.news.slug
          )
        );

      }

    }
  )
  .catch(
    error =>
      console.error(
        "LEGACY NEWS REDIRECT:",
        error
      )
  );

})();


// =====================================================
// GLOBAL
// =====================================================

let allNews = [];

let selectedCategory = "";


// =====================================================
// START
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    document
      .getElementById("year")
      .textContent =
      new Date().getFullYear();


    document
      .getElementById("searchButton")
      .addEventListener(
        "click",
        performSearch
      );


    document
      .getElementById("searchInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            performSearch();

          }

        }
      );


    loadCategories().then(setActiveCategoryFromUrl);

    loadNews();

  }
);


// =====================================================
// LOAD CATEGORIES
// =====================================================

async function loadCategories() {

  try {

    const response =
      await fetch(
        "/api/categories",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (!data.success) {
      throw new Error(
        data.error ||
        "श्रेणी लोड नहि भ' सकल"
      );
    }

    const nav =
      document.getElementById(
        "categoryNav"
      );

    const loading =
      document.getElementById(
        "categoryNavLoading"
      );

    if (loading) {
      loading.remove();
    }

    const categories =
      (data.categories || [])
        .filter(
          category =>
            String(category.status || "active")
              .toLowerCase() === "active"
        )
        .filter(
          category =>
            Number(category.show_in_menu ?? category.menu ?? 1) === 1
        )
        .sort(
          (a, b) =>
            Number(a.menu_order || 0) -
            Number(b.menu_order || 0)
        );

    categories.forEach(
      category => {

        const link =
          document.createElement(
            "a"
          );

        link.className =
          "nav-link";

        link.href =
          "/category/" +
          encodeURIComponent(
            category.slug
          );

        link.textContent =
          category.name;

        link.dataset.category =
          category.slug;

        nav.appendChild(
          link
        );

      }
    );

  } catch (error) {

    console.error(
      "CATEGORY ERROR:",
      error
    );

    const loading =
      document.getElementById(
        "categoryNavLoading"
      );

    if (loading) {
      loading.textContent =
        "श्रेणी उपलब्ध नहि अछि";
    }

  }

}


// =====================================================
// ACTIVE CATEGORY FROM URL
// =====================================================

function setActiveCategoryFromUrl() {

  const current =
    location.pathname;

  const links =
    document.querySelectorAll(
      "#categoryNav .nav-link"
    );

  links.forEach(
    link => {

      link.classList.remove(
        "active"
      );

      if (
        link.getAttribute("href") ===
        current
      ) {
        link.classList.add(
          "active"
        );
      }

    }
  );

}


// =====================================================
// LOAD NEWS
// =====================================================


// =====================================================

async function loadNews() {

  const container =
    document.getElementById(
      "newsContainer"
    );


  container.innerHTML =
    `
      <div
        class="loading"
        style="grid-column:1/-1"
      >
        समाचार लोड भ' रहल अछि...
      </div>
    `;


  try {

    const response =
      await fetch(
        "/api/news?status=published",
        {
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        "समाचार लोड नहि भ' सकल"
      );

    }


    allNews =
      data.news || [];


    filterNews();


  } catch (error) {

    console.error(
      "NEWS ERROR:",
      error
    );


    container.innerHTML =
      `
        <div
          class="error"
          style="grid-column:1/-1"
        >
          समाचार लोड नहि भ' सकल।
          <br>
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

  }

}


// =====================================================
// FILTER NEWS
// =====================================================

function filterNews() {

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  let filtered =
    [...allNews];


  // CATEGORY

  if (
    selectedCategory
  ) {

    filtered =
      filtered.filter(
        news =>
          String(
            news.category_id
          ) ===
          selectedCategory
      );

  }


  // SEARCH

  if (search) {

    filtered =
      filtered.filter(
        news => {

          const title =
            String(
              news.title || ""
            ).toLowerCase();


          const summary =
            String(
              news.summary || ""
            ).toLowerCase();


          const content =
            String(
              news.content || ""
            ).toLowerCase();


          return (
            title.includes(search) ||
            summary.includes(search) ||
            content.includes(search)
          );

        }
      );

  }


  renderNews(
    filtered
  );

}


// =====================================================
// SEARCH
// =====================================================

function performSearch() {

  document
    .getElementById(
      "sectionTitle"
    )
    .textContent =
      "खोज परिणाम";


  filterNews();

}


// =====================================================
// RENDER NEWS
// =====================================================

function renderNews(
  news
) {

  const container =
    document.getElementById(
      "newsContainer"
    );


  document
    .getElementById(
      "newsCount"
    )
    .textContent =
      news.length +
      " समाचार";


  if (!news.length) {

    container.innerHTML =
      `
        <div
          class="empty"
          style="grid-column:1/-1"
        >
          एहि खोज/श्रेणी में कोनो समाचार नहि भेटल।
        </div>
      `;

    return;

  }


  container.innerHTML =
    news
      .map(
        item =>
          createNewsCard(
            item
          )
      )
      .join("");

}


// =====================================================
// NEWS CARD
// =====================================================

function createNewsCard(
  news
) {

  const image =
    news.image_url
      ? `
        <img
          class="news-image"
          src="${escapeAttribute(
            news.image_url
          )}"
          alt="${escapeAttribute(
            news.title
          )}"
          loading="lazy"
          onerror="this.outerHTML='<div class=&quot;no-image&quot;>मैथिली समाचार</div>'"
        >
      `
      : `
        <div class="no-image">
          मैथिली समाचार
        </div>
      `;


  const summary =
    news.summary ||
    makeExcerpt(
      news.content,
      150
    );


  return `
    <article class="news-card">

      <a
        href="/news.html?id=${encodeURIComponent(
          news.id
        )}"
      >

        ${image}

        <div class="news-body">

          <div class="category">
            ${escapeHtml(
              news.category_name ||
              "समाचार"
            )}
          </div>


          <h2 class="news-title">
            ${escapeHtml(
              news.title
            )}
          </h2>


          <p class="news-summary">
            ${escapeHtml(
              summary
            )}
          </p>


          <div class="news-meta">

            <span>
              ${formatDate(
                news.published_at ||
                news.created_at
              )}
            </span>

            <span>
              👁 ${Number(
                news.views || 0
              )}
            </span>

          </div>

        </div>

      </a>

    </article>
  `;

}


// =====================================================
// EXCERPT
// =====================================================

function makeExcerpt(
  text,
  length
) {

  const clean =
    String(
      text || ""
    )
      .replace(
        /<[^>]*>/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if (
    clean.length <= length
  ) {

    return clean;

  }


  return (
    clean.substring(
      0,
      length
    ) +
    "..."
  );

}


// =====================================================
// DATE
// =====================================================

function formatDate(
  value
) {

  if (!value) {
    return "";
  }


  try {

    return new Date(
      value
    ).toLocaleDateString(
      "hi-IN",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  } catch {

    return "";

  }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// =====================================================
// ESCAPE ATTRIBUTE
// =====================================================

function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}

</script>

</body>
</html>
