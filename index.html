<!DOCTYPE html>
<html lang="mai">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>मैथिली समाचार</title>

<meta
  name="description"
  content="मैथिली भाषामे ताजा आ विश्वसनीय समाचार, मिथिला, बिहार आ देश-विदेशक समाचार।"
>

<meta
  name="robots"
  content="index, follow"
>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font-family:inherit;
}

button:focus-visible,
a:focus-visible,
input:focus-visible{
  outline:2px solid #ffb000;
  outline-offset:2px;
}

.container{
  width:min(1200px,94%);
  margin:auto;
}


/* =====================================================
   HEADER
===================================================== */

.top-header{
  background:#8b0000;
  color:white;
}

.header-main{
  padding:18px 0;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:30px;
  font-weight:800;
  line-height:1.2;
}

.tagline{
  font-size:14px;
  opacity:.9;
  margin-top:5px;
}

.admin-link{
  background:white;
  color:#8b0000;
  padding:9px 14px;
  border-radius:7px;
  font-size:13px;
  font-weight:bold;
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav{
  background:#650000;
  color:white;
}

.nav-inner{
  display:flex;
  align-items:center;
  gap:4px;
  overflow:visible;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  min-height:46px;
  position:relative;
  z-index:1000;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:10px 15px;
  border-radius:5px;
  white-space:nowrap;
  flex:0 0 auto;
  color:white;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.nav-link:hover,
.nav-link.active{
  background:rgba(255,255,255,.16);
}

.nav-loading{
  padding:10px 15px;
  color:rgba(255,255,255,.7);
  font-size:13px;
  white-space:nowrap;
}


/* =====================================================
   CATEGORY / SUBCATEGORY MENU
===================================================== */
.nav-group{
  position:relative;
  flex:0 0 auto;
}

.nav-group>.nav-link{
  display:inline-flex;
  align-items:center;
  gap:5px;
}

.nav-submenu{
  display:none;
  position:absolute;
  top:100%;
  left:0;
  min-width:210px;
  background:#fff;
  color:#222;
  z-index:99999;
  border:1px solid #ddd;
  border-radius:0 0 8px 8px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  padding:5px;
  margin:0;
}

.nav-submenu a{
  display:block;
  padding:10px 13px;
  color:#222;
  font-size:13px;
  white-space:nowrap;
  border-radius:5px;
  text-decoration:none;
}

.nav-submenu a:hover{
  background:#f2f2f2;
  color:#8b0000;
}

.mobile-menu-toggle{
  display:none;
  border:0;
  background:#520000;
  color:#fff;
  padding:10px 14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

/* Desktop: mouse hover opens submenu */
@media(min-width:601px){

  .nav-group:hover>.nav-submenu,
  .nav-group:focus-within>.nav-submenu{
    display:block;
  }

}

/* Mobile: tap parent category to open submenu */
@media(max-width:600px){

  .mobile-menu-toggle{
    display:block;
    width:100%;
    text-align:left;
  }

  .nav-inner{
    display:none;
    flex-direction:column;
    align-items:stretch;
    overflow:visible;
    padding:6px 0;
    position:relative;
    z-index:1000;
  }

  .nav-inner.mobile-open{
    display:flex;
  }

  .nav-group{
    width:100%;
  }

  .nav-group>.nav-link{
    width:100%;
    justify-content:space-between;
  }

  .nav-submenu{
    position:static;
    width:100%;
    min-width:0;
    box-shadow:none;
    border:0;
    border-radius:0;
    background:#520000;
    padding:0 0 4px 14px;
    display:none;
  }

  .nav-group.open>.nav-submenu{
    display:block;
  }

  .nav-submenu a{
    color:#fff;
    font-size:13px;
    padding:8px 12px;
  }

  .nav-submenu a:hover{
    background:rgba(255,255,255,.1);
    color:#fff;
  }

}

/* =====================================================
   SEARCH
===================================================== */

.search-section{
  padding:18px 0;
  background:white;
  border-bottom:1px solid #ddd;
}

.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  flex:1;
  min-width:0;
  height:46px;
  padding:0 14px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.search-box button{
  min-width:90px;
  border:0;
  background:#8b0000;
  color:white;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  padding:0 20px;
}


/* =====================================================
   MAIN
===================================================== */

main{
  padding:25px 0 60px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.section-title h1{
  margin:0;
  font-size:24px;
}

.section-title span{
  color:#777;
  font-size:14px;
}


/* =====================================================
   FEATURED
===================================================== */

.featured-grid{
  display:grid;
  grid-template-columns:
    minmax(0,2fr)
    minmax(280px,1fr);
  gap:20px;
  margin-bottom:30px;
}

.featured-main,
.featured-side{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:
    0 2px 12px rgba(0,0,0,.08);
}

.featured-main img{
  width:100%;
  height:330px;
  object-fit:cover;
  display:block;
}

.featured-content{
  padding:18px;
}

.featured-content .category{
  margin-bottom:8px;
}

.featured-title{
  font-size:27px;
  line-height:1.35;
  margin:0 0 10px;
}

.featured-summary{
  color:#666;
  line-height:1.7;
  margin:0;
}

.featured-side{
  display:flex;
  flex-direction:column;
}

.featured-side-item{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:12px;
  padding:12px;
  border-bottom:1px solid #eee;
}

.featured-side-item:last-child{
  border-bottom:0;
}

.featured-side-item img,
.featured-side-image{
  width:110px;
  height:80px;
  object-fit:cover;
  border-radius:7px;
}

.featured-side-title{
  font-size:15px;
  line-height:1.45;
  font-weight:700;
}


/* =====================================================
   NEWS GRID
===================================================== */

.news-grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:20px;
}

.news-card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:
    0 2px 10px rgba(0,0,0,.07);
  transition:
    transform .2s,
    box-shadow .2s;
}

.news-card:hover{
  transform:translateY(-3px);
  box-shadow:
    0 6px 20px rgba(0,0,0,.13);
}

.news-card-link{
  display:block;
  height:100%;
}

.news-image,
.no-image{
  width:100%;
  height:200px;
}

.news-image{
  object-fit:cover;
  display:block;
  background:#eee;
}

.no-image{
  background:
    linear-gradient(
      135deg,
      #eee,
      #ddd
    );
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
}

.news-body{
  padding:16px;
}

.category{
  display:inline-block;
  color:#8b0000;
  font-size:12px;
  font-weight:bold;
  margin-bottom:8px;
}

.news-title{
  font-size:19px;
  line-height:1.4;
  margin:0 0 9px;
}

.news-summary{
  color:#666;
  font-size:14px;
  line-height:1.6;
  margin:0 0 12px;
}

.news-tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:12px;
}

.news-tag{
  color:#8b0000;
  background:#fff1f1;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
}

.news-meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#888;
  font-size:12px;
  border-top:1px solid #eee;
  padding-top:10px;
}


/* =====================================================
   STATES
===================================================== */

.loading,
.empty,
.error{
  background:white;
  padding:40px 20px;
  text-align:center;
  border-radius:10px;
  color:#777;
}

.error{
  color:#a00000;
}


/* =====================================================
   CATEGORY HOME SECTIONS
===================================================== */
.category-home-section{margin:30px 0 42px}
.category-home-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:3px solid #8b0000;margin-bottom:16px;padding-bottom:10px}
.category-home-title{margin:0;font-size:25px;color:#650000;font-weight:800}
.category-home-desc{margin:5px 0 0;color:#777;font-size:13px;line-height:1.5}
.category-home-all{color:#8b0000;font-weight:800;font-size:14px;white-space:nowrap}
.category-home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.category-home-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);transition:transform .18s,box-shadow .18s}
.category-home-card:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(0,0,0,.12)}
.category-home-card img,.category-home-image{width:100%;height:190px;object-fit:cover;display:block;background:#eee}
.category-home-body{padding:14px}
.category-home-card h3{margin:5px 0 8px;font-size:17px;line-height:1.5}
.category-home-summary{color:#666;font-size:13px;line-height:1.65;margin:0}
.category-home-date{color:#999;font-size:11px;margin-top:9px}
@media(max-width:900px){
  .category-home-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .category-home-card img,.category-home-image{height:150px}
  .category-home-card h3{font-size:15px}
}
@media(max-width:600px){
  .category-home-section{margin:22px 0 30px}
  .category-home-head{align-items:flex-start}
  .category-home-title{font-size:20px}
  .category-home-all{font-size:12px}
  .category-home-grid{grid-template-columns:1fr;gap:11px}
  .category-home-card{display:grid;grid-template-columns:105px 1fr}
  .category-home-card img,.category-home-image{height:95px}
  .category-home-body{padding:9px 10px}
  .category-home-card h3{font-size:15px;line-height:1.4;margin:0 0 5px}
  .category-home-summary{font-size:12px;line-height:1.45;display:block;overflow:hidden}
  .category-home-date{font-size:10px;margin-top:5px}
}

/* =====================================================
   FOOTER
===================================================== */
/* =====================================================
   FOOTER
===================================================== */

.site-footer{background:#171717;color:#fff;margin-top:45px;text-align:left}
.footer-wrap{width:min(1200px,94%);margin:auto;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:34px;padding:34px 0}
.footer-col h3{margin:0 0 11px;font-size:16px}
.footer-col p{margin:0;color:#c7c7c7;line-height:1.7;font-size:13px}
.footer-col a{display:block;color:#ddd;margin:8px 0;font-size:13px}
.footer-logo{max-width:150px;max-height:45px;object-fit:contain;margin-bottom:10px}
.footer-bottom{border-top:1px solid #333;padding:13px 3%;text-align:center;color:#aaa;font-size:12px}
@media(max-width:600px){.footer-wrap{grid-template-columns:1fr;gap:22px;padding:26px 14px}.footer-bottom{padding:12px}}
/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

  .news-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .featured-grid{
    grid-template-columns:1fr;
  }

}


@media(max-width:600px){

  .container{
    width:92%;
  }

  .header-main{
    padding:14px 0;
  }

  .header-inner{
    align-items:flex-start;
  }

  .logo{
    font-size:24px;
  }

  .tagline{
    font-size:12px;
  }

  .admin-link{
    display:none;
  }

  .nav-link{
    min-height:44px;
    padding:10px 12px;
    font-size:13px;
  }

  .search-section{
    padding:12px 0;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box input{
    width:100%;
  }

  .search-box button{
    width:100%;
    height:44px;
  }

  main{
    padding:18px 0 40px;
  }

  .section-title{
    align-items:flex-start;
    flex-direction:column;
    gap:5px;
  }

  .section-title h1{
    font-size:21px;
  }

  .news-grid{
    grid-template-columns:1fr;
    gap:15px;
  }

  .news-image,
  .no-image{
    height:210px;
  }

  .featured-main img{
    height:230px;
  }

  .featured-title{
    font-size:22px;
  }

  .featured-side-item{
    grid-template-columns:95px 1fr;
  }

  .featured-side-item img,
  .featured-side-image{
    width:95px;
    height:75px;
  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

  .logo{
    font-size:22px;
  }

  .news-title{
    font-size:18px;
  }

  .news-body{
    padding:14px;
  }

}

</style>


<style id="professional-mobile-home">

<style id="mithilalive-professional-theme">

  --brand:#7a1020;--brand-dark:#5f0b18;--paper:#fffdf8;--surface:#fff;
  --ink:#202124;--muted:#6b7280;--line:#e5e7eb;--soft:#f6f3ee;
  --radius:12px;--shadow:0 4px 18px rgba(32,33,36,.07)
}

.nav-link:hover,.nav-link.active{background:#f6ecee;color:var(--brand)!important}
.search-section{background:transparent!important;border:0!important;padding:0!important}

main>.container{max-width:1180px}
.section-title,.section-header{border-bottom:2px solid var(--brand);display:flex;align-items:end;justify-content:space-between;margin:28px 0 15px;padding-bottom:8px}
.section-title h1,.section-header h2{margin:0;color:var(--brand);font-size:23px;font-weight:850}

.featured-card,.news-card,.category-home-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

.category-home-title{margin:0;color:var(--brand);font-size:22px;font-weight:850}
.category-home-desc{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.category-home-all{color:var(--brand)!important;font-weight:800;font-size:13px;white-space:nowrap}
.category-home-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.category-home-card{box-shadow:none}
.category-home-card img,.category-home-image{width:100%;height:175px;object-fit:cover}
.category-home-body{padding:12px}
.category-home-card h3{font-size:16px;line-height:1.45;margin:0 0 7px}
.category-home-summary{display:block!important;color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 7px}
.category-home-date{color:#999;font-size:10px}
.site-footer,footer{background:#202124!important;color:#fff!important;margin-top:42px}
.site-footer .footer-wrap{max-width:1180px;margin:auto}
.site-footer a,footer a{color:#ddd!important}
@media(min-width:701px){
  .header-main .header-inner{padding-right:300px;position:relative}
  .header-main .header-inner:after{content:"";display:block}
  .header-main .search-section{display:block!important;position:absolute;right:0;top:15px}
}
@media(max-width:700px){
  .top-header{position:relative}
  .header-inner{min-height:58px;padding:8px 12px}
  .logo{font-size:20px}
  .tagline{font-size:9px}
  .header-search-row{display:block;padding:7px 12px;background:#fff}
  .header-search-row .search-box{width:100%}
  .header-search-row .search-box input{flex:1;width:auto;height:40px}
  .header-search-row .search-box button{height:40px;min-width:48px;font-size:0}

<script>

/* ======================================================
   GLOBAL
====================================================== */

let allNews = [];

let categories = [];

let currentCategorySlug = "";


/* ======================================================
   START
====================================================== */

document.addEventListener(
  "DOMContentLoaded",
  start
);


async function start(){

  document
    .getElementById("year")
    .textContent =
    new Date().getFullYear();


  document
    .getElementById("searchForm")
    .addEventListener(
      "submit",
      function(event){

        event.preventDefault();

        performSearch();

      }
    );


  await loadCategories();

  await loadNews();

}


/* ======================================================
   LOAD CATEGORIES
====================================================== */

async function loadCategories(){

  try{

    const response =
      await fetch(
        "/api/categories?status=active",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !data.success
    ){

      throw new Error(
        data.error ||
        "श्रेणी लोड नहि भ' सकल"
      );

    }


    categories =
      (data.categories || [])
        .filter(
          category =>
            String(
              category.status ||
              "active"
            ).toLowerCase()
            === "active"
        )
        .filter(
          category =>
            Number(
              category.menu_visible ??
              category.show_in_menu ??
              1
            ) === 1
        )
        .sort(
          (a,b) =>
            Number(
              a.menu_order || 0
            ) -
            Number(
              b.menu_order || 0
            )
        );


    renderCategoryMenu();


    setActiveCategory();


  }catch(error){

    console.error(
      "CATEGORY ERROR:",
      error
    );


    const loading =
      document.getElementById(
        "categoryNavLoading"
      );


    if(loading){

      loading.textContent =
        "श्रेणी उपलब्ध नहि अछि";

    }

  }

}


/* ======================================================
   RENDER CATEGORY MENU
====================================================== */

function renderCategoryMenu(){

  const nav =
    document.getElementById(
      "categoryNav"
    );

  const loading =
    document.getElementById(
      "categoryNavLoading"
    );

  if(!nav){
    return;
  }

  if(loading){
    loading.remove();
  }

  /* Keep the home link. */
  const homeLink =
    nav.querySelector(
      '.nav-link[data-category=""]'
    );

  nav.innerHTML = "";

  if(homeLink){
    nav.appendChild(homeLink);
  }

  /*
   * Only root categories become
   * main menu items.
   */
  const roots =
    categories.filter(
      category => {
        const parentId =
          category.parent_id ??
          category.parentId ??
          null;

        return (
          parentId === null ||
          parentId === undefined ||
          parentId === "" ||
          Number(parentId) === 0
        );
      }
    );

  roots.forEach(
    category => {

      if(!category.slug){
        return;
      }

      /* Find children belonging to this parent. */
      const kids =
        categories
          .filter(
            child =>
              Number(
                child.parent_id ??
                child.parentId ??
                0
              ) ===
              Number(category.id)
          )
          .filter(
            child =>
              String(
                child.status ||
                "active"
              ).toLowerCase() ===
              "active"
          )
          .filter(
            child =>
              Number(
                child.menu_visible ??
                child.show_in_menu ??
                1
              ) === 1
          )
          .sort(
            (a,b) =>
              Number(a.menu_order || 0) -
              Number(b.menu_order || 0)
          );

      const group =
        document.createElement(
          "div"
        );

      group.className =
        "nav-group";

      const link =
        document.createElement(
          "a"
        );

      link.className =
        "nav-link";

      link.href =
        "/category/" +
        encodeURIComponent(
          category.slug
        );

      link.dataset.category =
        category.slug;

      link.innerHTML =
        `<span>${escapeHtml(
          category.name ||
          "श्रेणी"
        )}</span>` +
        (kids.length
          ? `<span aria-hidden="true">▾</span>`
          : "");

      group.appendChild(
        link
      );

      if(kids.length){

        const sub =
          document.createElement(
            "div"
          );

        sub.className =
          "nav-submenu";

        kids.forEach(
          child => {

            if(!child.slug){
              return;
            }

            const childLink =
              document.createElement(
                "a"
              );

            childLink.href =
              "/category/" +
              encodeURIComponent(
                child.slug
              );

            childLink.textContent =
              child.name ||
              "उप-श्रेणी";

            childLink.dataset.category =
              child.slug;

            sub.appendChild(
              childLink
            );

          }
        );

        group.appendChild(
          sub
        );

        /* Mobile only: tap parent to expand. */
        link.addEventListener(
          "click",
          function(event){

            if(
              window.innerWidth <= 600
            ){

              event.preventDefault();

              group.classList.toggle(
                "open"
              );

            }

          }
        );

      }

      nav.appendChild(
        group
      );

    }
  );

  /* Mobile main menu button. */
  const toggle =
    document.getElementById(
      "mobileMenuToggle"
    );

  if(
    toggle &&
    !toggle.dataset.bound
  ){

    toggle.dataset.bound =
      "1";

    toggle.addEventListener(
      "click",
      function(){

        nav.classList.toggle(
          "mobile-open"
        );

        const isOpen =
          nav.classList.contains(
            "mobile-open"
          );

        toggle.setAttribute(
          "aria-expanded",
          String(isOpen)
        );

      }
    );

  }

}


/* ======================================================
   ACTIVE CATEGORY
====================================================== */

function setActiveCategory(){

  const path =
    location.pathname
      .replace(
        /\/+$/,
        ""
      );


  document
    .querySelectorAll(
      "#categoryNav .nav-link"
    )
    .forEach(
      link => {

        link.classList.remove(
          "active"
        );


        const href =
          link.getAttribute(
            "href"
          );


        if(
          path ===
          href.replace(
            /\/+$/,
            ""
          )
        ){

          link.classList.add(
            "active"
          );

        }

      }
    );

}


/* ======================================================
   LOAD NEWS
====================================================== */

async function loadNews(){
  const container=document.getElementById("categorySections");
  if(!container) return;
  container.innerHTML='<div class="loading" style="grid-column:1/-1">समाचार लोड भ\' रहल अछि...</div>';
  try{
    const active=categories
      .filter(c=>String(c.status||"active").toLowerCase()==="active")
      .filter(c=>Number(c.menu_visible ?? c.show_in_menu ?? 1)===1);

    if(!active.length){container.innerHTML='<div class="empty">कोनो श्रेणी नहि भेटल।</div>';return;}

    // Home order: main categories first, then sub-categories according to their own home_order.
    active.sort((a,b)=>{
      const ao=Number(a.home_order ?? a.homeOrder ?? a.menu_order ?? 0);
      const bo=Number(b.home_order ?? b.homeOrder ?? b.menu_order ?? 0);
      return ao-bo || Number(a.menu_order??0)-Number(b.menu_order??0) || String(a.name||"").localeCompare(String(b.name||""));
    });

    // If a parent has children, keep the parent's position and then its children.
    const byParent={};
    active.forEach(c=>{
      const p=(c.parent_id===null||c.parent_id===undefined||c.parent_id===""||Number(c.parent_id)===0)?"root":String(c.parent_id);
      (byParent[p] ||= []).push(c);
    });
    Object.values(byParent).forEach(list=>list.sort((a,b)=>{
      const ao=Number(a.home_order ?? a.homeOrder ?? a.menu_order ?? 0);
      const bo=Number(b.home_order ?? b.homeOrder ?? b.menu_order ?? 0);
      return ao-bo || Number(a.menu_order??0)-Number(b.menu_order??0);
    }));
    const ordered=[];
    const add=(c)=>{
      ordered.push(c);
      (byParent[String(c.id)]||[]).forEach(add);
    };
    (byParent.root||[]).forEach(add);

    const results=await Promise.all(ordered.map(async category=>{
      const response=await fetch("/api/news?status=published&category_id="+encodeURIComponent(category.id)+"&page=1&limit=6",{cache:"no-store"});
      const data=await response.json();
      if(!response.ok||!data.success) throw new Error(data.error||"समाचार लोड नहि भ' सकल");
      return {category,news:data.news||[]};
    }));
    const withNews=results.filter(x=>x.news.length);
    if(!withNews.length){container.innerHTML='<div class="empty">एखन कोनो प्रकाशित समाचार नहि अछि।</div>';return;}

    container.innerHTML=withNews.map(({category,news})=>{
      const slug=category.slug||"";
      const desc=category.description||"";
      return `<section class="category-home-section ${category.parent_id?'is-subcategory':''}">
        <div class="category-home-head">
          <div class="category-home-heading">
            <h2 class="category-home-title">${escapeHtml(category.name||"श्रेणी")}</h2>
            ${desc?`<p class="category-home-desc">${escapeHtml(desc)}</p>`:""}
          </div>
          <a class="category-home-all" href="/category/${encodeURIComponent(slug)}">क सभ समाचार पढ़ू →</a>
        </div>
        <div class="category-home-grid">
          ${news.slice(0,6).map(item=>{
            const nslug=item.slug||item.id;
            const image=item.image_url?`<img src="${escapeAttribute(item.image_url)}" alt="${escapeAttribute(item.title)}" loading="lazy" decoding="async">`:`<div class="category-home-image no-image">मैथिली समाचार</div>`;
            return `<article class="category-home-card"><a href="/news/${encodeURIComponent(nslug)}">${image}<div class="category-home-body"><h3>${escapeHtml(item.title||"समाचार")}</h3>${item.summary?`<p class="category-home-summary">${escapeHtml(item.summary)}</p>`:""}<div class="category-home-date">${formatDate(item.published_at||item.created_at)}</div></div></a></article>`;
          }).join("")}
        </div>
      </section>`;
    }).join("");
  }catch(error){
    console.error("HOME CATEGORY NEWS ERROR:",error);
    container.innerHTML=`<div class="error" style="grid-column:1/-1">समाचार लोड नहि भ' सकल।<br>${escapeHtml(error.message||"त्रुटि भेल")}</div>`;
  }
}

/* ======================================================
   FEATURED NEWS
====================================================== */

function renderFeatured(
  news
){

  const featured =
    news.filter(
      item =>
        Number(
          item.featured || 0
        ) === 1
    );


  const section =
    document.getElementById(
      "featuredSection"
    );


  const container =
    document.getElementById(
      "featuredContainer"
    );


  if(
    !featured.length
  ){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  const main =
    featured[0];


  const side =
    featured
      .slice(1,4);


  container.innerHTML =
    `
      <a
        class="featured-main"
        href="/news/${encodeURIComponent(
          main.slug || main.id
        )}"
      >

        ${
          main.image_url

          ? `
            <img
              src="${escapeAttribute(
                main.image_url
              )}"
              alt="${escapeAttribute(
                main.title
              )}"
              loading="lazy"
            >
          `

          : `
            <div
              class="no-image"
              style="height:330px"
            >
              मैथिली समाचार
            </div>
          `
        }


        <div class="featured-content">

          <div class="category">
            ${escapeHtml(
              main.category_name ||
              "समाचार"
            )}
          </div>


          <h2 class="featured-title">
            ${escapeHtml(
              main.title
            )}
          </h2>


          <p class="featured-summary">
            ${escapeHtml(
              main.summary ||
              makeExcerpt(
                main.content,
                220
              )
            )}
          </p>

        </div>

      </a>


      <div class="featured-side">

        ${
          side.length

          ? side
              .map(
                item =>
                  `
                    <a
                      class="featured-side-item"
                      href="/news/${encodeURIComponent(
                        item.slug ||
                        item.id
                      )}"
                    >

                      ${
                        item.image_url

                        ? `
                          <img
                            src="${escapeAttribute(
                              item.image_url
                            )}"
                            alt="${escapeAttribute(
                              item.title
                            )}"
                            loading="lazy"
                          >
                        `

                        : `
                          <div
                            class="featured-side-image no-image"
                          >
                            समाचार
                          </div>
                        `
                      }


                      <div>

                        <div
                          class="category"
                        >
                          ${escapeHtml(
                            item.category_name ||
                            "समाचार"
                          )}
                        </div>


                        <div
                          class="featured-side-title"
                        >
                          ${escapeHtml(
                            item.title
                          )}
                        </div>

                      </div>

                    </a>
                  `
              )
              .join("")

          : `
            <div
              class="empty"
              style="height:100%"
            >
              अन्य प्रमुख समाचार
            </div>
          `
        }

      </div>
    `;

}


/* ======================================================
   FILTER / SEARCH
====================================================== */

function performSearch(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(query){

    document
      .getElementById(
        "sectionTitle"
      )
      .textContent =
      "खोज परिणाम";

  }else{

    document
      .getElementById(
        "sectionTitle"
      )
      .textContent =
      "नवीनतम समाचार";

  }


  let filtered =
    [...allNews];


  if(
    currentCategorySlug
  ){

    filtered =
      filtered.filter(
        news =>
          String(
            news.category_slug ||
            ""
          ).toLowerCase()
          ===
          currentCategorySlug
            .toLowerCase()
      );

  }


  if(query){

    filtered =
      filtered.filter(
        news => {

          const title =
            String(
              news.title || ""
            )
              .toLowerCase();


          const summary =
            String(
              news.summary || ""
            )
              .toLowerCase();


          const content =
            String(
              news.content || ""
            )
              .toLowerCase();


          const tags =
            (news.tags || [])
              .map(
                tag =>
                  String(
                    tag.name ||
                    tag.slug ||
                    ""
                  ).toLowerCase()
              )
              .join(" ");


          return (
            title.includes(query) ||
            summary.includes(query) ||
            content.includes(query) ||
            tags.includes(query)
          );

        }
      );

  }


  renderNews(
    filtered
  );

}


/* ======================================================
   RENDER NEWS
====================================================== */

function renderNews(
  news
){

  const container =
    document.getElementById(
      "newsContainer"
    );


  document
    .getElementById(
      "newsCount"
    )
    .textContent =
      news.length +
      " समाचार";


  if(
    !news.length
  ){

    container.innerHTML =
      `
        <div
          class="empty"
          style="grid-column:1/-1"
        >
          एहि खोज/श्रेणी में
          कोनो समाचार नहि भेटल।
        </div>
      `;

    return;

  }


  container.innerHTML =
    news
      .map(
        item =>
          createNewsCard(
            item
          )
      )
      .join("");

}


/* ======================================================
   NEWS CARD
====================================================== */

function createNewsCard(
  news
){

  const slug =
    news.slug ||
    news.id;


  const image =
    news.image_url

    ? `
      <img
        class="news-image"
        src="${escapeAttribute(
          news.image_url
        )}"
        alt="${escapeAttribute(
          news.title
        )}"
        loading="lazy"
        onerror="
          this.outerHTML =
          '<div class=&quot;no-image&quot;>मैथिली समाचार</div>'
        "
      >
    `

    : `
      <div class="no-image">
        मैथिली समाचार
      </div>
    `;


  const summary =
    news.summary ||
    makeExcerpt(
      news.content,
      150
    );


  const tags =
    Array.isArray(
      news.tags
    )
      ? news.tags
      : [];


  const tagsHtml =
    tags.length

      ? `
        <div class="news-tags">

          ${
            tags
              .slice(0,4)
              .map(
                tag =>
                  `
                    <span
                      class="news-tag"
                    >
                      #${escapeHtml(
                        tag.name ||
                        tag.slug
                      )}
                    </span>
                  `
              )
              .join("")
          }

        </div>
      `

      : "";


  return `
    <article class="news-card">

      <a
        class="news-card-link"
        href="/news/${encodeURIComponent(
          slug
        )}"
      >

        ${image}


        <div class="news-body">

          <div class="category">
            ${escapeHtml(
              news.category_name ||
              "समाचार"
            )}
          </div>


          <h2 class="news-title">
            ${escapeHtml(
              news.title
            )}
          </h2>


          <p class="news-summary">
            ${escapeHtml(
              summary
            )}
          </p>


          ${tagsHtml}


          <div class="news-meta">

            <span>
              ${formatDate(
                news.published_at ||
                news.created_at
              )}
            </span>


            <span>
              👁
              ${Number(
                news.views || 0
              )}
            </span>

          </div>

        </div>

      </a>

    </article>
  `;

}


/* ======================================================
   EXCERPT
====================================================== */

function makeExcerpt(
  text,
  length
){

  const clean =
    String(
      text || ""
    )
      .replace(
        /<[^>]*>/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if(
    clean.length <= length
  ){

    return clean;

  }


  return (
    clean.substring(
      0,
      length
    ) +
    "..."
  );

}


/* ======================================================
   DATE
====================================================== */

function formatDate(
  value
){

  if(!value){
    return "";
  }


  try{

    return new Date(
      value
    ).toLocaleDateString(
      "hi-IN",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  }catch{

    return "";

  }

}


/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ======================================================
   ESCAPE ATTRIBUTE
====================================================== */

function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}

</script>

 document.addEventListener('DOMContentLoaded',loadSiteChrome);
