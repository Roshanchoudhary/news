<!DOCTYPE html>
<html lang="mai">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tag | मैथिली समाचार</title>

      name="description"
      content="मैथिली समाचार Tag">

<meta name="robots" content="index, follow">

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font-family:inherit;
}

.container{
  width:min(1200px,94%);
  margin:auto;
}

/* HEADER */

.top-header{
  background:#8b0000;
  color:#fff;
}

.header-main{
  padding:18px 0;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:30px;
  font-weight:800;
}

.tagline{
  margin-top:5px;
  font-size:14px;
  opacity:.9;
}

.home-link{
  background:#fff;
  color:#8b0000;
  padding:9px 14px;
  border-radius:7px;
  font-size:13px;
  font-weight:bold;
}

/* NAV */

/* =====================================================
   NAV
===================================================== */

.nav{
  background:#650000;
  color:#fff;
}

.nav-inner{
  display:flex;
  align-items:stretch;
  gap:3px;
  min-height:46px;
  position:relative;
}

.nav-link,
.nav-parent-btn{
  color:#fff;
  font-size:13px;
  font-weight:600;
}

.nav-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:10px 14px;
  border-radius:5px;
  white-space:nowrap;
}

.nav-link:hover,
.nav-link.active{
  background:rgba(255,255,255,.16);
}

.nav-parent{
  position:relative;
  display:flex;
  align-items:stretch;
}

.nav-parent-btn{
  border:0;
  background:transparent;
  min-height:46px;
  padding:10px 14px;
  cursor:pointer;
  white-space:nowrap;
  border-radius:5px;
}

.nav-parent-btn:hover,
.nav-parent.open > .nav-parent-btn{
  background:rgba(255,255,255,.16);
}

.nav-arrow{
  margin-left:7px;
  font-size:10px;
}

.nav-dropdown{
  position:absolute;
  left:0;
  top:100%;
  min-width:210px;
  background:#fff;
  color:#222;
  border-radius:0 0 8px 8px;
  box-shadow:0 8px 25px rgba(0,0,0,.22);
  padding:6px;
  display:none;
  z-index:1000;
}

.nav-parent:hover > .nav-dropdown,
.nav-parent.open > .nav-dropdown{
  display:block;
}

.nav-dropdown a{
  display:block;
  color:#333;
  padding:10px 12px;
  border-radius:6px;
  font-size:13px;
  white-space:nowrap;
}

.nav-dropdown a:hover,
.nav-dropdown a.active{
  background:#f4e8e8;
  color:#8b0000;
}


/* =====================================================
   MOBILE NAV
===================================================== */

@media(max-width:600px){

  .nav-inner{
    display:block;
    min-height:0;
    padding:5px 0;
  }

  .nav-link{
    width:100%;
    min-height:44px;
    justify-content:flex-start;
    padding:11px 12px;
  }

  .nav-parent{
    display:block;
  }

  .nav-parent-btn{
    width:100%;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-align:left;
    padding:11px 12px;
  }

  .nav-dropdown{
    position:static;
    min-width:0;
    display:none;
    box-shadow:none;
    border-radius:0;
    padding:0 0 5px 14px;
    background:rgba(0,0,0,.12);
  }

  .nav-parent.open > .nav-dropdown{
    display:block;
  }

  .nav-dropdown a{
    color:#fff;
    padding:10px 12px;
  }

  .nav-dropdown a:hover,
  .nav-dropdown a.active{
    background:rgba(255,255,255,.12);
    color:#fff;
  }

}

.search-section{
  background:#fff;
  padding:15px 0;
  border-bottom:1px solid #ddd;
}

.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  flex:1;
  min-width:0;
  height:45px;
  padding:0 14px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:14px;
}

.search-box button{
  min-width:90px;
  border:0;
  border-radius:7px;
  background:#8b0000;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

/* MAIN */

main{
  padding:28px 0 60px;
}

/* TAG HEADER */

.tag-header{
  background:#fff;
  padding:25px;
  border-radius:12px;
  margin-bottom:25px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.breadcrumb{
  color:#777;
  font-size:13px;
  margin-bottom:12px;
}

.breadcrumb a{
  color:#8b0000;
  font-weight:600;
}

.tag-title{
  margin:0;
  font-size:32px;
  line-height:1.35;
}

.tag-description{
  margin:10px 0 0;
  color:#666;
  font-size:15px;
  line-height:1.7;
}

.tag-label{
  display:inline-block;
  background:#fff1f1;
  color:#8b0000;
  padding:6px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:10px;
}

/* SECTION */

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:17px;
}

.section-header h2{
  margin:0;
  font-size:22px;
}

.news-count{
  color:#777;
  font-size:13px;
}

/* NEWS GRID */

.news-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
}

.news-card{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
  transition:.2s;
}

.news-card:hover{
  transform:translateY(-3px);
  box-shadow:0 7px 20px rgba(0,0,0,.13);
}

.news-image,
.no-image{
  width:100%;
  height:200px;
}

.news-image{
  display:block;
  object-fit:cover;
  background:#eee;
}

.no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#eee,#ddd);
  color:#888;
}

.news-body{
  padding:16px;
}

.news-category{
  color:#8b0000;
  font-size:12px;
  font-weight:bold;
  margin-bottom:8px;
}

.news-title{
  margin:0 0 9px;
  font-size:19px;
  line-height:1.4;
}

.news-summary{
  color:#666;
  font-size:14px;
  line-height:1.65;
  margin:0 0 12px;
}

.news-tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:12px;
}

.news-tag{
  background:#fff1f1;
  color:#8b0000;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
}

.news-meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-top:1px solid #eee;
  padding-top:10px;
  color:#888;
  font-size:12px;
}

/* PAGINATION */

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:30px;
}

.page-btn{
  min-width:40px;
  height:40px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}

.page-btn:hover,
.page-btn.active{
  background:#8b0000;
  color:#fff;
  border-color:#8b0000;
}

.page-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* STATES */

.loading,
.empty,
.error{
  background:#fff;
  border-radius:10px;
  padding:45px 20px;
  text-align:center;
  color:#777;
  grid-column:1/-1;
}

.error{
  color:#a00000;
}

/* FOOTER */

footer{
  background:#222;
  color:#fff;
  text-align:center;
  padding:30px 0;
}

footer p{
  color:#bbb;
  font-size:13px;
}

/* MOBILE */

@media(max-width:900px){

  .news-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

@media(max-width:600px){

  .container{
    width:92%;
  }

  .header-main{
    padding:14px 0;
  }

  .logo{
    font-size:24px;
  }

  .tagline{
    font-size:12px;
  }

  .home-link{
    padding:8px 10px;
    font-size:12px;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    width:100%;
    height:44px;
  }

  main{
    padding:18px 0 40px;
  }

  .tag-header{
    padding:18px;
    border-radius:9px;
  }

  .tag-title{
    font-size:25px;
  }

  .tag-description{
    font-size:14px;
  }

  .section-header{
    align-items:flex-start;
    flex-direction:column;
    gap:5px;
  }

  .news-grid{
    grid-template-columns:1fr;
    gap:15px;
  }

  .news-image,
  .no-image{
    height:210px;
  }

  .news-body{
    padding:14px;
  }

  .news-title{
    font-size:18px;
  }

}

</style>
</head>


<body>

<header class="top-header">

  <div class="header-main">

    <div class="container header-inner">

      <div>

        <div class="logo">
          मैथिली समाचार
        </div>

        <div class="tagline">
          मैथिली भाषामे नवीनतम समाचार
        </div>

      </div>

      <a href="/" class="home-link">
        ← मुख्य पृष्ठ
      </a>

    </div>

  </div>


  <nav class="nav">

    <div
      class="container nav-inner"
      id="categoryNav"
    >

      <a href="/" class="nav-link">
        सभ समाचार
      </a>

    </div>

  </nav>

</header>


<section class="search-section">

  <div class="container">

    <form
      class="search-box"
      id="searchForm"
    >

      <input
        type="search"
        id="searchInput"
        placeholder="समाचार खोजू..."
      >

      <button type="submit">
        खोजू
      </button>

    </form>

  </div>

</section>


<main>

  <div class="container">

    <section
      class="tag-header"
      id="tagHeader"
    >

      <div class="breadcrumb">

        <a href="/">
          मुख्य पृष्ठ
        </a>

        <span>
          &nbsp;›&nbsp;
        </span>

        <span>
          Tag
        </span>

      </div>


      <div
        class="tag-label"
        id="tagLabel"
      >
        #Tag
      </div>


      <h1
        class="tag-title"
        id="tagTitle"
      >
        Tag लोड भ' रहल अछि...
      </h1>


      <p
        class="tag-description"
        id="tagDescription"
      ></p>

    </section>


    <div class="section-header">

      <h2>
        एहि Tag केर समाचार
      </h2>

      <span
        class="news-count"
        id="newsCount"
      >
        0 समाचार
      </span>

    </div>


    <div
      id="newsContainer"
      class="news-grid"
    >

      <div class="loading">
        समाचार लोड भ' रहल अछि...
      </div>

    </div>


    <div
      id="pagination"
      class="pagination"
    ></div>

  </div>

</main>


<footer>

  <div class="container">

    <strong>
      मैथिली समाचार
    </strong>

    <p>
      मैथिली भाषामे समाचार आ जानकारी।
    </p>

    <p>
      ©
      <span id="year"></span>
      मैथिली समाचार
    </p>

  </div>

</footer>


<script>

let tag = null;

let currentPage = 1;

const limit = 12;


document.addEventListener(
  "DOMContentLoaded",
  start
);


async function start(){

  document
    .getElementById("year")
    .textContent =
    new Date().getFullYear();


  document
    .getElementById("searchForm")
    .addEventListener(
      "submit",
      function(e){

        e.preventDefault();

        searchNews();

      }
    );


  await loadCategories();

  await loadTag();

}


/* =====================================================
   GET TAG SLUG
===================================================== */

function getTagSlug(){

  const path =
    location.pathname
      .replace(/\/+$/,"");


  const parts =
    path
      .split("/")
      .filter(Boolean);


  if(
    parts.length >= 2 &&
    parts[0] === "tag"
  ){

    return decodeURIComponent(
      parts[1]
    );

  }


  const params =
    new URLSearchParams(
      location.search
    );


  return (
    params.get("slug") ||
    ""
  );

}


/* =====================================================
   CATEGORY MENU
===================================================== */

async function loadCategories(){

  try{

    const response =
      await fetch(
        "/api/categories?status=active&menu=1",
        { cache:"no-store" }
      );

    const data =
      await response.json();

    if(!data.success){
      return;
    }

    const categories =
      (data.categories || [])
        .filter(
          item =>
            String(item.status || "active").toLowerCase() === "active"
        )
        .filter(
          item =>
            Number(item.menu_visible ?? item.show_in_menu ?? 1) === 1
        );

    const nav =
      document.getElementById("categoryNav");

    if(!nav){
      return;
    }

    nav.innerHTML = "";

    const home =
      document.createElement("a");

    home.href = "/";
    home.className = "nav-link";
    home.textContent = "सभ समाचार";
    nav.appendChild(home);

    const parents =
      categories
        .filter(item => !item.parent_id)
        .sort(categoryOrder);

    const childrenByParent = {};

    categories.forEach(
      item => {

        if(!item.parent_id){
          return;
        }

        const key = String(item.parent_id);

        if(!childrenByParent[key]){
          childrenByParent[key] = [];
        }

        childrenByParent[key].push(item);

      }
    );

    Object.keys(childrenByParent).forEach(
      key =>
        childrenByParent[key].sort(categoryOrder)
    );

    parents.forEach(
      parent => {

        if(!parent.slug){
          return;
        }

        const children =
          childrenByParent[String(parent.id)] || [];

        if(!children.length){

          nav.appendChild(
            createCategoryLink(parent)
          );

          return;
        }

        const wrapper =
          document.createElement("div");

        wrapper.className = "nav-parent";

        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "nav-parent-btn";

        button.innerHTML =
          `<span>${escapeHtml(parent.name)}</span>
           <span class="nav-arrow">▼</span>`;

        button.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            document
              .querySelectorAll("#categoryNav .nav-parent.open")
              .forEach(
                item => {
                  if(item !== wrapper){
                    item.classList.remove("open");
                  }
                }
              );

            wrapper.classList.toggle("open");

          }
        );

        const dropdown =
          document.createElement("div");

        dropdown.className = "nav-dropdown";

        children.forEach(
          child =>
            dropdown.appendChild(
              createCategoryLink(child)
            )
        );

        wrapper.appendChild(button);
        wrapper.appendChild(dropdown);
        nav.appendChild(wrapper);

      }
    );

  }catch(error){

    console.error(
      "CATEGORY MENU ERROR:",
      error
    );

  }

}


function categoryOrder(a,b){

  const order =
    Number(a.menu_order || 0) -
    Number(b.menu_order || 0);

  if(order !== 0){
    return order;
  }

  return String(a.name || "")
    .localeCompare(
      String(b.name || ""),
      "hi"
    );

}


function createCategoryLink(category){

  const link =
    document.createElement("a");

  link.href =
    "/category/" +
    encodeURIComponent(category.slug);

  link.className =
    "nav-link";

  link.textContent =
    category.name;

  return link;

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD TAG
===================================================== */

async function loadTag(){

  const slug =
    getTagSlug();


  if(!slug){

    showError(
      "Tag URL सही नहि अछि।"
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/tags?slug=" +
        encodeURIComponent(
          slug
        ),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success ||
      !data.tag
    ){

      throw new Error(
        data.error ||
        "Tag नहि भेटल"
      );

    }


    tag =
      data.tag;


    document.title =
      "#" +
      tag.name +
      " | मैथिली समाचार";


    document
      .getElementById(
        "metaDescription"
      )
      .setAttribute(
        "content",
        tag.description ||
        `#${tag.name} सँ जुड़ल मैथिली समाचार`
      );


    document
      .getElementById(
        "tagLabel"
      )
      .textContent =
      "#" + tag.name;


    document
      .getElementById(
        "tagTitle"
      )
      .textContent =
      tag.name;


    document
      .getElementById(
        "tagDescription"
      )
      .textContent =
      tag.description ||
      `#${tag.name} सँ जुड़ल नवीनतम समाचार`;


    await loadNews();

  }catch(error){

    console.error(
      error
    );


    showError(
      error.message ||
      "Tag लोड नहि भ' सकल"
    );

  }

}


/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews(
  search=""
){

  const container =
    document.getElementById(
      "newsContainer"
    );


  container.innerHTML =
    `
      <div class="loading">
        समाचार लोड भ' रहल अछि...
      </div>
    `;


  if(!tag){
    return;
  }


  try{

    let apiUrl =
      "/api/news?status=published" +
      "&tag_id=" +
      encodeURIComponent(
        tag.id
      ) +
      "&page=" +
      currentPage +
      "&limit=" +
      limit;


    if(search){

      apiUrl +=
        "&search=" +
        encodeURIComponent(
          search
        );

    }


    const response =
      await fetch(
        apiUrl,
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "समाचार नहि भेटल"
      );

    }


    const news =
      data.news || [];


    const pagination =
      data.pagination || {
        page:currentPage,
        pages:1,
        total:news.length
      };


    renderNews(
      news
    );


    renderPagination(
      pagination
    );

  }catch(error){

    console.error(
      error
    );


    container.innerHTML =
      `
        <div class="error">
          ${escapeHtml(
            error.message ||
            "समाचार लोड नहि भ' सकल"
          )}
        </div>
      `;


    document
      .getElementById(
        "pagination"
      )
      .innerHTML = "";

  }

}


/* =====================================================
   RENDER NEWS
===================================================== */

function renderNews(
  news
){

  const container =
    document.getElementById(
      "newsContainer"
    );


  document
    .getElementById(
      "newsCount"
    )
    .textContent =
    news.length +
    " समाचार";


  if(!news.length){

    container.innerHTML =
      `
        <div class="empty">
          एहि Tag सँ जुड़ल
          कोनो प्रकाशित समाचार नहि भेटल।
        </div>
      `;

    return;

  }


  container.innerHTML =
    news
      .map(
        createNewsCard
      )
      .join("");

}


/* =====================================================
   CARD
===================================================== */

function createNewsCard(
  news
){

  const slug =
    news.slug ||
    news.id;


  const image =
    news.image_url

    ? `
      <img
        class="news-image"
        src="${escapeAttribute(
          news.image_url
        )}"
        alt="${escapeAttribute(
          news.title
        )}"
        loading="lazy"
      >
    `

    : `
      <div class="no-image">
        मैथिली समाचार
      </div>
    `;


  const summary =
    news.summary ||
    makeExcerpt(
      news.content,
      150
    );


  const tags =
    Array.isArray(
      news.tags
    )
      ? news.tags
      : [];


  const tagsHtml =
    tags.length

    ? `
      <div class="news-tags">

        ${
          tags
            .slice(0,4)
            .map(
              item =>
                `
                  <span
                    class="news-tag"
                  >
                    #${escapeHtml(
                      item.name ||
                      item.slug
                    )}
                  </span>
                `
            )
            .join("")
        }

      </div>
    `

    : "";


  return `
    <article class="news-card">

      <a
        href="/news/${encodeURIComponent(
          slug
        )}"
      >

        ${image}


        <div class="news-body">

          <div class="news-category">
            ${escapeHtml(
              news.category_name ||
              "समाचार"
            )}
          </div>


          <h2 class="news-title">
            ${escapeHtml(
              news.title
            )}
          </h2>


          <p class="news-summary">
            ${escapeHtml(
              summary
            )}
          </p>


          ${tagsHtml}


          <div class="news-meta">

            <span>
              ${formatDate(
                news.published_at ||
                news.created_at
              )}
            </span>


            <span>
              👁
              ${Number(
                news.views || 0
              )}
            </span>

          </div>

        </div>

      </a>

    </article>
  `;

}


/* =====================================================
   PAGINATION
===================================================== */

function renderPagination(
  pagination
){

  const container =
    document.getElementById(
      "pagination"
    );


  const pages =
    Number(
      pagination.pages || 1
    );


  const page =
    Number(
      pagination.page ||
      currentPage
    );


  if(pages <= 1){

    container.innerHTML =
      "";

    return;

  }


  let html = "";


  html += `
    <button
      class="page-btn"
      ${page <= 1 ? "disabled" : ""}
      onclick="changePage(${page - 1})"
    >
      ‹
    </button>
  `;


  const start =
    Math.max(
      1,
      page - 2
    );


  const end =
    Math.min(
      pages,
      page + 2
    );


  for(
    let i=start;
    i<=end;
    i++
  ){

    html += `
      <button
        class="page-btn ${
          i === page
            ? "active"
            : ""
        }"
        onclick="changePage(${i})"
      >
        ${i}
      </button>
    `;

  }


  html += `
    <button
      class="page-btn"
      ${page >= pages ? "disabled" : ""}
      onclick="changePage(${page + 1})"
    >
      ›
    </button>
  `;


  container.innerHTML =
    html;

}


/* =====================================================
   PAGE
===================================================== */

function changePage(
  page
){

  if(page < 1){
    return;
  }


  currentPage =
    page;


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  loadNews(
    search
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   SEARCH
===================================================== */

function searchNews(){

  currentPage =
    1;


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  loadNews(
    search
  );

}

/* =====================================================
   EXCERPT
===================================================== */

function makeExcerpt(
  text,
  length
){

  const clean =
    String(
      text || ""
    )
      .replace(
        /<[^>]*>/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if(
    clean.length <= length
  ){
    return clean;
  }


  return (
    clean.substring(
      0,
      length
    ) +
    "..."
  );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
  value
){

  if(!value){
    return "";
  }


  try{

    return new Date(
      value
    ).toLocaleDateString(
      "hi-IN",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  }catch{

    return "";

  }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}
