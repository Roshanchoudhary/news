<!DOCTYPE html>
<html lang="mai">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard - मैथिली समाचार</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#222;font-family:Arial,"Noto Sans Devanagari",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1200px,94%);margin:auto}

.header{background:#8b0000;color:#fff;padding:15px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:25px;font-weight:700}
.user-info{font-size:13px;opacity:.9}

.btn{border:0;border-radius:6px;padding:9px 14px;font-weight:600}
.btn-primary{background:#8b0000;color:#fff}
.btn-secondary{background:#555;color:#fff}
.btn-success{background:#16733a;color:#fff}
.btn-danger{background:#b00020;color:#fff}
.btn-light{background:#fff;border:1px solid #ddd;color:#333}

main{padding:25px 0 60px}

.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-title h1{margin:0 0 5px;font-size:25px}
.page-title p{margin:0;color:#777}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat{background:#fff;padding:18px;border-radius:9px;box-shadow:0 2px 8px #0000000d}
.stat span{font-size:13px;color:#777}
.stat strong{display:block;font-size:28px;margin-top:7px}

.panel{background:#fff;border-radius:9px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px #0000000d}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}
.panel-header h2{font-size:19px;margin:0}

.message{display:none;padding:11px;border-radius:6px;margin-bottom:15px}
.message.success{display:block;background:#e7f6eb;color:#176b2c}
.message.error{display:block;background:#fde8e8;color:#a00000}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.full{grid-column:1/-1}
.form-group label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d5d5d5;border-radius:6px;background:#fff}
textarea{min-height:100px;resize:vertical}
.checkbox{display:flex;align-items:center;gap:8px}
.checkbox input{width:auto}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left}
th{background:#f7f7f7;font-size:13px}
td{font-size:14px}

.badge{display:inline-block;padding:4px 8px;border-radius:15px;font-size:11px;font-weight:600}
.badge-active{background:#e4f6e9;color:#176b2c}
.badge-inactive{background:#eee;color:#666}
.badge-visible{background:#e8f1ff;color:#1454a0}

.category-slug{font-family:monospace;color:#666;font-size:12px}

.category-actions{display:flex;gap:5px;flex-wrap:wrap}

.hidden{display:none!important}

.empty{padding:25px;text-align:center;color:#777}

@media(max-width:800px){
.stats{grid-template-columns:repeat(2,1fr)}
.form-grid{grid-template-columns:1fr}
.full{grid-column:auto}
}

@media(max-width:500px){
.stats{grid-template-columns:1fr}
.page-title{align-items:flex-start;flex-direction:column}
.header-inner{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<header class="header">
<div class="container header-inner">

<div>
<div class="logo">मैथिली समाचार</div>
<div class="user-info" id="adminInfo">Admin Dashboard</div>
</div>

<button type="button" class="btn btn-light" id="logoutBtn">
Logout
</button>

</div>
</header>


<main class="container">

<div class="page-title">
<div>
<h1>Admin Dashboard</h1>
<p>समाचार, श्रेणी आ Menu प्रबंधन</p>
</div>

<button type="button" class="btn btn-primary" id="newNewsBtn">
+ नवीन समाचार
</button>
</div>


<!-- ================= STATS ================= -->

<div class="stats">

<div class="stat">
<span>कुल समाचार</span>
<strong id="totalNews">0</strong>
</div>

<div class="stat">
<span>Published</span>
<strong id="publishedNews">0</strong>
</div>

<div class="stat">
<span>Draft</span>
<strong id="draftNews">0</strong>
</div>

<div class="stat">
<span>Categories</span>
<strong id="totalCategories">0</strong>
</div>

</div>


<!-- =====================================================
     CATEGORY MANAGEMENT
====================================================== -->

<section class="panel">

<div class="panel-header">
<h2>📂 Category Management</h2>

<button
type="button"
class="btn btn-light"
id="cancelCategoryBtn"
style="display:none">
Cancel
</button>
</div>


<div id="categoryMessage" class="message"></div>


<div class="form-grid">

<div class="form-group">

<label>
श्रेणी नाम *
</label>

<input
type="text"
id="categoryName"
placeholder="जैसे: मिथिला"
>

</div>


<div class="form-group">

<label>
English URL Slug *
</label>

<input
type="text"
id="categorySlug"
placeholder="जैसे: mithila"
>

</div>


<div class="form-group full">

<label>
विवरण
</label>

<textarea
id="categoryDescription"
placeholder="श्रेणीक विवरण..."
></textarea>

</div>


<div class="form-group">

<label>
Menu Order
</label>

<input
type="number"
id="categoryOrder"
value="0"
min="0"
>

</div>


<div class="form-group">

<label>
Status
</label>

<select id="categoryStatus">

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>

</div>


<div class="form-group full">

<label class="checkbox">

<input
type="checkbox"
id="categoryMenuVisible"
checked
>

<span>
Menu में देखाउ
</span>

</label>

</div>

</div>


<div class="actions">

<button
type="button"
class="btn btn-primary"
id="saveCategoryBtn">
+ श्रेणी जोड़ू
</button>

<button
type="button"
class="btn btn-light"
id="resetCategoryBtn">
Reset
</button>

</div>

</section>


<!-- =====================================================
     CATEGORY LIST
====================================================== -->

<section class="panel">

<div class="panel-header">

<h2>
सभी श्रेणी
</h2>

</div>


<div id="categoryList">

<div class="empty">
श्रेणी लोड भ' रहल अछि...
</div>

</div>

</section>


<!-- =====================================================
     NEWS EDITOR
====================================================== -->

<section
class="panel hidden"
id="newsEditor">

<div class="panel-header">

<h2 id="newsEditorTitle">
नवीन समाचार
</h2>

<button
type="button"
class="btn btn-light"
id="closeNewsBtn">
बन्द करू
</button>

</div>


<div id="newsMessage" class="message"></div>


<form id="newsForm">

<input
type="hidden"
id="newsId"
>


<div class="form-grid">


<div class="form-group full">

<label>
समाचार शीर्षक *
</label>

<input
type="text"
id="newsTitle"
required
placeholder="समाचारक शीर्षक"
>

</div>


<div class="form-group">

<label>
Category
</label>

<select id="newsCategory">

<option value="">
Category चुनू
</option>

</select>

</div>


<div class="form-group">

<label>
Status
</label>

<select id="newsStatus">

<option value="draft">
Draft
</option>

<option value="published">
Published
</option>

</select>

</div>


<div class="form-group full">

<label>
English URL Slug
</label>

<input
type="text"
id="newsSlug"
placeholder="darbhanga-new-medical-college"
>

</div>


<div class="form-group full">

<label>
Tags
</label>

<input
type="text"
id="newsTags"
placeholder="darbhanga, health, education"
>

<small style="color:#777">
Tags comma (,) सँ अलग करू।
</small>

</div>


<div class="form-group full">

<label>
संक्षिप्त समाचार
</label>

<textarea
id="newsSummary"
></textarea>

</div>


<div class="form-group full">

<label>
पूरा समाचार *
</label>

<textarea
id="newsContent"
style="min-height:300px"
required
></textarea>

</div>


<div class="form-group full">

<label>
Photo URL
</label>

<input
type="url"
id="newsImage"
placeholder="https://..."
>

</div>


<div class="form-group">

<label>
SEO Title
</label>

<input
type="text"
id="seoTitle"
>

</div>


<div class="form-group">

<label>
SEO Description
</label>

<input
type="text"
id="seoDescription"
>

</div>


<div class="form-group">

<label class="checkbox">

<input
type="checkbox"
id="newsFeatured"
>

<span>
Featured News
</span>

</label>

</div>

</div>


<div class="actions">

<button
type="submit"
class="btn btn-primary">
Save News
</button>

<button
type="button"
class="btn btn-light"
id="cancelNewsBtn">
Cancel
</button>

</div>

</form>

</section>


<!-- =====================================================
     NEWS LIST
====================================================== -->

<section class="panel">

<div class="panel-header">

<h2>
📰 समाचार सूची
</h2>

<select
id="newsFilter"
style="width:170px">

<option value="all">
सभ
</option>

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

</select>

</div>


<div id="newsList">

<div class="empty">
समाचार लोड भ' रहल अछि...
</div>

</div>

</section>

</main>


<script>

// ======================================================
// GLOBAL
// ======================================================

let categories = [];
let editingCategoryId = null;


// ======================================================
// START
// ======================================================

document.addEventListener(
"DOMContentLoaded",
start
);


async function start(){

bindEvents();

const logged =
await checkLogin();

if(!logged){
return;
}

await loadCategories();

await loadNews();

}


// ======================================================
// EVENTS
// ======================================================

function bindEvents(){

document
.getElementById("saveCategoryBtn")
.addEventListener(
"click",
saveCategory
);


document
.getElementById("resetCategoryBtn")
.addEventListener(
"click",
resetCategoryForm
);


document
.getElementById("cancelCategoryBtn")
.addEventListener(
"click",
resetCategoryForm
);


document
.getElementById("newNewsBtn")
.addEventListener(
"click",
newNews
);


document
.getElementById("closeNewsBtn")
.addEventListener(
"click",
closeNews
);


document
.getElementById("cancelNewsBtn")
.addEventListener(
"click",
closeNews
);


document
.getElementById("newsForm")
.addEventListener(
"submit",
saveNews
);


document
.getElementById("newsFilter")
.addEventListener(
"change",
loadNews
);


document
.getElementById("logoutBtn")
.addEventListener(
"click",
logout
);


// Auto slug

document
.getElementById("categoryName")
.addEventListener(
"input",
function(){

if(editingCategoryId){
return;
}

const slug =
slugify(
this.value
);

document
.getElementById("categorySlug")
.value =
slug;

}
);

}


// ======================================================
// LOGIN CHECK
// ======================================================

async function checkLogin(){

try{

const response =
await fetch(
"/api/login",
{
method:"GET",
credentials:"same-origin",
cache:"no-store"
}
);

const data =
await response.json();

if(
!response.ok ||
!data.success
){

window.location.href =
"/admin.html";

return false;
}

document
.getElementById("adminInfo")
.textContent =
(data.user?.name || "Admin") +
" (" +
(data.user?.role || "admin") +
")";

return true;

}catch(error){

console.error(error);

window.location.href =
"/admin.html";

return false;

}

}


// ======================================================
// LOAD CATEGORIES
// ======================================================

async function loadCategories(){

try{

const response =
await fetch(
"/api/categories",
{
credentials:"same-origin",
cache:"no-store"
}
);

const data =
await response.json();

if(!data.success){

throw new Error(
data.error ||
"Category loading failed"
);

}

categories =
data.categories || [];

document
.getElementById("totalCategories")
.textContent =
categories.length;

renderCategories();

fillNewsCategories();

}catch(error){

console.error(
"LOAD CATEGORY:",
error
);

document
.getElementById("categoryList")
.innerHTML =
`
<div class="empty">
श्रेणी लोड नहि भ' सकल।
<br>
${escapeHtml(error.message)}
</div>
`;

}

}


// ======================================================
// RENDER CATEGORIES
// ======================================================

function renderCategories(){

const box =
document.getElementById(
"categoryList"
);

if(!categories.length){

box.innerHTML =
`
<div class="empty">
एखन कोनो category नहि अछि।
</div>
`;

return;

}


box.innerHTML = `

<div class="table-wrap">

<table>

<thead>

<tr>

<th>क्रम</th>

<th>नाम</th>

<th>English URL</th>

<th>Menu</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

${
categories
.map(
cat => `

<tr>

<td>
${Number(cat.menu_order || 0)}
</td>

<td>

<strong>
${escapeHtml(cat.name)}
</strong>

${
cat.description
?
`
<br>
<small style="color:#777">
${escapeHtml(cat.description)}
</small>
`
:
""
}

</td>

<td>

<span class="category-slug">
/${escapeHtml(cat.slug)}
</span>

</td>

<td>

${
Number(cat.menu_visible)
?
`<span class="badge badge-visible">
Menu
</span>`
:
`<span class="badge badge-inactive">
Hidden
</span>`
}

</td>

<td>

${
cat.status === "active"
?
`<span class="badge badge-active">
Active
</span>`
:
`<span class="badge badge-inactive">
Inactive
</span>`
}

</td>

<td>

<div class="category-actions">

<button
type="button"
class="btn btn-secondary"
onclick="editCategory(${Number(cat.id)})">
Edit
</button>

<button
type="button"
class="btn btn-danger"
onclick="deleteCategory(${Number(cat.id)})">
Delete
</button>

</div>

</td>

</tr>

`
)
.join("")
}

</tbody>

</table>

</div>
`;

}


// ======================================================
// SAVE CATEGORY
// ======================================================

async function saveCategory(){

const name =
document
.getElementById("categoryName")
.value
.trim();

const slug =
document
.getElementById("categorySlug")
.value
.trim()
.toLowerCase();

const description =
document
.getElementById("categoryDescription")
.value
.trim();

const menuOrder =
Number(
document
.getElementById("categoryOrder")
.value || 0
);

const menuVisible =
document
.getElementById("categoryMenuVisible")
.checked;

const status =
document
.getElementById("categoryStatus")
.value;


if(!name){

showCategoryMessage(
"श्रेणी नाम जरूरी अछि।",
"error"
);

return;
}


if(!slug){

showCategoryMessage(
"English URL slug जरूरी अछि।",
"error"
);

return;
}


if(
!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)
){

showCategoryMessage(
"URL slug केवल English अक्षर, number आ hyphen में लिखू। उदाहरण: mithila-news",
"error"
);

return;
}


const body = {

name:name,

slug:slug,

description:description,

menu_visible:menuVisible,

menu_order:menuOrder,

status:status

};


try{

const url =
editingCategoryId
?
"/api/categories?id=" +
encodeURIComponent(
editingCategoryId
)
:
"/api/categories";


const method =
editingCategoryId
?
"PUT"
:
"POST";


const response =
await fetch(
url,
{
method:method,

credentials:
"same-origin",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(body)
}
);


const data =
await response.json();


if(!data.success){

showCategoryMessage(
data.error ||
"Category save नहि भ' सकल।",
"error"
);

return;

}


showCategoryMessage(
editingCategoryId
?
"श्रेणी सफलतापूर्वक update भ' गेल।"
:
"श्रेणी सफलतापूर्वक जोड़ल गेल।",
"success"
);


resetCategoryForm();

await loadCategories();


}catch(error){

console.error(
" SAVE CATEGORY:",
error
);

showCategoryMessage(
"Server error: " +
error.message,
"error"
);

}

}


// ======================================================
// EDIT CATEGORY
// ======================================================

function editCategory(id){

const category =
categories.find(
item =>
Number(item.id) ===
Number(id)
);

if(!category){
return;
}


editingCategoryId =
category.id;


document
.getElementById("categoryName")
.value =
category.name || "";


document
.getElementById("categorySlug")
.value =
category.slug || "";


document
.getElementById("categoryDescription")
.value =
category.description || "";


document
.getElementById("categoryOrder")
.value =
Number(
category.menu_order || 0
);


document
.getElementById("categoryMenuVisible")
.checked =
Number(
category.menu_visible
) === 1;


document
.getElementById("categoryStatus")
.value =
category.status === "inactive"
?
"inactive"
:
"active";


document
.getElementById("saveCategoryBtn")
.textContent =
"✓ Category Update करू";


document
.getElementById("cancelCategoryBtn")
.style.display =
"inline-block";


document
.getElementById("categoryName")
.focus();


window.scrollTo({
top:0,
behavior:"smooth"
});

}


// ======================================================
// RESET CATEGORY
// ======================================================

function resetCategoryForm(){

editingCategoryId =
null;


document
.getElementById("categoryName")
.value =
"";


document
.getElementById("categorySlug")
.value =
"";


document
.getElementById("categoryDescription")
.value =
"";


document
.getElementById("categoryOrder")
.value =
"0";


document
.getElementById("categoryMenuVisible")
.checked =
true;


document
.getElementById("categoryStatus")
.value =
"active";


document
.getElementById("saveCategoryBtn")
.textContent =
"+ श्रेणी जोड़ू";


document
.getElementById("cancelCategoryBtn")
.style.display =
"none";

}


// ======================================================
// DELETE CATEGORY
// ======================================================

async function deleteCategory(id){

if(
!confirm(
"की अहाँ एहि category केँ delete कर' चाहैत छी?"
)
){
return;
}


try{

const response =
await fetch(
"/api/categories?id=" +
encodeURIComponent(id),
{
method:"DELETE",
credentials:"same-origin"
}
);


const data =
await response.json();


if(!data.success){

showCategoryMessage(
data.error ||
"Category delete नहि भ' सकल।",
"error"
);

return;
}


showCategoryMessage(
"Category delete भ' गेल।",
"success"
);


await loadCategories();


}catch(error){

console.error(error);

showCategoryMessage(
"Server error।",
"error"
);

}

}


// ======================================================
// CATEGORY MESSAGE
// ======================================================

function showCategoryMessage(
text,
type
){

const box =
document.getElementById(
"categoryMessage"
);

box.textContent =
text;

box.className =
"message " +
type;

setTimeout(
function(){

box.className =
"message";

},
4000
);

}


// ======================================================
// FILL NEWS CATEGORY
// ======================================================

function fillNewsCategories(){

const select =
document.getElementById(
"newsCategory"
);

select.innerHTML =
`
<option value="">
Category चुनू
</option>
`;


categories
.filter(
cat =>
cat.status === "active"
)
.forEach(
cat => {

const option =
document.createElement(
"option"
);

option.value =
cat.id;

option.textContent =
cat.name;

select.appendChild(
option
);

}
);

}


// ======================================================
// LOAD NEWS
// ======================================================

async function loadNews(){

try{

const filter =
document
.getElementById("newsFilter")
.value;


const response =
await fetch(
"/api/news?status=" +
encodeURIComponent(filter),
{
credentials:"same-origin",
cache:"no-store"
}
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.error ||
"News loading failed"
);

}


const news =
data.news || [];


document
.getElementById("totalNews")
.textContent =
news.length;


document
.getElementById("publishedNews")
.textContent =
news.filter(
item =>
item.status ===
"published"
).length;


document
.getElementById("draftNews")
.textContent =
news.filter(
item =>
item.status ===
"draft"
).length;


renderNews(
news
);


}catch(error){

console.error(
"LOAD NEWS:",
error
);

document
.getElementById("newsList")
.innerHTML =
`
<div class="empty">
समाचार लोड नहि भ' सकल।
</div>
`;

}

}


// ======================================================
// RENDER NEWS
// ======================================================

function renderNews(news){

const box =
document.getElementById(
"newsList"
);


if(!news.length){

box.innerHTML =
`
<div class="empty">
एखन कोनो समाचार नहि अछि।
</div>
`;

return;
}


box.innerHTML = `

<div class="table-wrap">

<table>

<thead>

<tr>

<th>शीर्षक</th>
<th>Category</th>
<th>Status</th>
<th>Views</th>
<th>Action</th>

</tr>

</thead>

<tbody>

${
news
.map(
item => `

<tr>

<td>
<strong>
${escapeHtml(item.title)}
</strong>

<br>

<small style="color:#777">
${escapeHtml(
item.slug || ""
)}
</small>

</td>

<td>
${escapeHtml(
item.category_name ||
"-"
)}
</td>

<td>
${escapeHtml(
item.status
)}
</td>

<td>
${Number(item.views || 0)}
</td>

<td>

<button
type="button"
class="btn btn-secondary"
onclick="editNews(${Number(item.id)})">
Edit
</button>

<button
type="button"
class="btn btn-danger"
onclick="deleteNews(${Number(item.id)})">
Delete
</button>

</td>

</tr>

`
)
.join("")
}

</tbody>

</table>

</div>
`;

}

// ======================================================
// EDIT NEWS
// ======================================================

async function editNews(id){

try{

const response =
await fetch(
"/api/news?id=" +
encodeURIComponent(id),
{
credentials:"same-origin",
cache:"no-store"
}
);


const data =
await response.json();


if(
!data.success ||
!data.news
){

alert(
data.error ||
"समाचार नहि भेटल।"
);

return;
}


const n =
data.news;


document
.getElementById("newsId")
.value =
n.id;


document
.getElementById("newsTitle")
.value =
n.title || "";


document
.getElementById("newsSlug")
.value =
n.slug || "";


document
.getElementById("newsCategory")
.value =
n.category_id || "";


document
.getElementById("newsStatus")
.value =
n.status || "draft";


document
.getElementById("newsSummary")
.value =
n.summary || "";


document
.getElementById("newsContent")
.value =
n.content || "";


document
.getElementById("newsImage")
.value =
n.image_url || "";


document
.getElementById("seoTitle")
.value =
n.seo_title || "";


document
.getElementById("seoDescription")
.value =
n.seo_description || "";


document
.getElementById("newsFeatured")
.checked =
Number(n.featured) === 1;


document
.getElementById("newsEditorTitle")
.textContent =
"समाचार Edit करू";


document
.getElementById("newsEditor")
.classList
.remove("hidden");


window.scrollTo({
top:0,
behavior:"smooth"
});


}catch(error){

console.error(error);

alert(
"समाचार लोड नहि भ' सकल।"
);

}

}


// ======================================================
// SAVE NEWS
// ======================================================

async function saveNews(event){

event.preventDefault();


const id =
document
.getElementById("newsId")
.value;


const title =
document
.getElementById("newsTitle")
.value
.trim();


const slug =
document
.getElementById("newsSlug")
.value
.trim();


const content =
document
.getElementById("newsContent")
.value
.trim();


if(!title || !content){

showNewsMessage(
"शीर्षक आ समाचार जरूरी अछि।",
"error"
);

return;
}


const body = {

title:title,

slug:slug,

category_id:
document
.getElementById("newsCategory")
.value
?
Number(
document
.getElementById("newsCategory")
.value
)
:
null,

status:
document
.getElementById("newsStatus")
.value,

summary:
document
.getElementById("newsSummary")
.value
.trim(),

content:content,

image_url:
document
.getElementById("newsImage")
.value
.trim(),

seo_title:
document
.getElementById("seoTitle")
.value
.trim(),

seo_description:
document
.getElementById("seoDescription")
.value
.trim(),

featured:
document
.getElementById("newsFeatured")
.checked,

tags:
document
.getElementById("newsTags")
.value
.split(",")
.map(
x =>
x.trim()
)
.filter(Boolean)

};


try{

const response =
await fetch(
id
?
"/api/news?id=" +
encodeURIComponent(id)
:
"/api/news",
{
method:
id
?
"PUT"
:
"POST",

credentials:
"same-origin",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(body)
}
);


const data =
await response.json();


if(!data.success){

showNewsMessage(
data.error ||
"समाचार save नहि भ' सकल।",
"error"
);

return;
}


showNewsMessage(
"समाचार सफलतापूर्वक save भ' गेल।",
"success"
);


await loadNews();


setTimeout(
closeNews,
700
);


}catch(error){

console.error(error);

showNewsMessage(
"Server error: " +
error.message,
"error"
);

}

}

if(

)
){

}


try{

const response =
await fetch(
"/api/news?id=" +

}

const data =
await response.json();

}catch(error){

);

}

}

// ======================================================
// SLUGIFY
// ======================================================

function slugify(value){

return String(value || "")
.toLowerCase()
.trim()
.replace(
/[^a-z0-9]+/g,
"-"
)
.replace(
/^-+|-+$/g,
""
);

}


// ======================================================
// ESCAPE
// ======================================================

function escapeHtml(value){

return String(
value ?? ""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
