<!DOCTYPE html>
<html lang="mai">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - मैथिली समाचार</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(1150px, 94%);
      margin: auto;
    }

    .dashboard-header {
      background: #8b0000;
      color: white;
      padding: 15px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .header-inner h1 {
      margin: 0 0 4px;
      font-size: 25px;
    }

    .header-inner small {
      opacity: .9;
    }

    .dashboard {
      padding: 25px 0 60px;
    }

    .page-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .page-title h2 {
      margin: 0 0 5px;
    }

    .page-title p {
      margin: 0;
      color: #666;
    }

    button {
      font-family: inherit;
    }

    .btn {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: #8b0000;
      color: white;
    }

    .btn-primary:hover {
      background: #6d0000;
    }

    .btn-secondary {
      background: #555;
      color: white;
    }

    .btn-danger {
      background: #b00020;
      color: white;
    }

    .btn-light {
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    .btn-success {
      background: #16733a;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .stat-card span {
      color: #666;
      font-size: 14px;
    }

    .stat-card strong {
      display: block;
      margin-top: 8px;
      font-size: 30px;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .panel-title h3 {
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .form-group {
      margin-bottom: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d7d7d7;
      border-radius: 7px;
      background: white;
      color: #222;
      font-size: 15px;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #8b0000;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    #summary {
      min-height: 100px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .message {
      display: none;
      padding: 11px 13px;
      margin-bottom: 15px;
      border-radius: 7px;
    }

    .message.success {
      display: block;
      background: #e7f6eb;
      color: #176b2c;
    }

    .message.error {
      display: block;
      background: #fde8e8;
      color: #a00000;
    }

    .news-filter {
      width: 180px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .news-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    .news-table th,
    .news-table td {
      padding: 12px 9px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
    }

    .news-table th {
      background: #f7f7f7;
      font-weight: 700;
    }

    .news-title {
      font-weight: 600;
      line-height: 1.4;
    }

    .news-date {
      display: block;
      color: #777;
      font-size: 12px;
      margin-top: 5px;
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-published {
      background: #e3f5e8;
      color: #176b2c;
    }

    .status-draft {
      background: #fff2d6;
      color: #8a5a00;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-buttons .btn {
      padding: 7px 11px;
      font-size: 13px;
    }

    /* CATEGORY */

    .category-add {
      display: grid;
      grid-template-columns:
        1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 20px;
    }

    .category-list {
      border-top: 1px solid #eee;
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .category-name {
      font-weight: 600;
    }

    .category-slug {
      color: #777;
      font-size: 13px;
      margin-left: 7px;
    }

    .category-description {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }

    .loading {
      color: #777;
      padding: 15px 0;
    }

    .empty {
      color: #777;
      padding: 20px 0;
    }

    @media (max-width: 850px) {

      .stats {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .category-add {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .page-title {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-title {
        align-items: flex-start;
        flex-direction: column;
      }

      .news-filter {
        width: 100%;
      }
    }

    @media (max-width: 420px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header class="dashboard-header">

  <div class="container header-inner">

    <div>
      <h1>मैथिली समाचार</h1>

      <small id="adminName">
        Admin Dashboard
      </small>
    </div>

    <button
      type="button"
      class="btn btn-light"
      id="logoutButton"
    >
      Logout
    </button>

  </div>

</header>


<main class="container dashboard">


  <!-- =====================================================
       PAGE TITLE
  ====================================================== -->

  <section class="page-title">

    <div>

      <h2>
        Admin Dashboard
      </h2>

      <p>
        समाचार आ श्रेणी प्रबंधन
      </p>

    </div>

    <button
      type="button"
      class="btn btn-primary"
      id="newNewsButton"
    >
      + नवीन समाचार
    </button>

  </section>


  <!-- =====================================================
       STATISTICS
  ====================================================== -->

  <section class="stats">

    <div class="stat-card">

      <span>
        कुल समाचार
      </span>

      <strong id="totalNews">
        0
      </strong>

    </div>


    <div class="stat-card">

      <span>
        प्रकाशित
      </span>

      <strong id="publishedNews">
        0
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Draft
      </span>

      <strong id="draftNews">
        0
      </strong>

    </div>


    <div class="stat-card">

      <span>
        श्रेणी
      </span>

      <strong id="totalCategories">
        0
      </strong>

    </div>

  </section>


  <!-- =====================================================
       NEWS EDITOR
  ====================================================== -->

  <section
    class="panel hidden"
    id="editorPanel"
  >

    <div class="panel-title">

      <h3 id="editorTitle">
        नवीन समाचार
      </h3>

      <button
        type="button"
        class="btn btn-light"
        id="closeEditorButton"
      >
        बन्द करू
      </button>

    </div>


    <div
      id="editorMessage"
      class="message"
    ></div>


    <!-- ONLY NEWS FORM -->

    <form id="newsForm">

      <input
        type="hidden"
        id="newsId"
      >


      <div class="form-grid">


        <!-- TITLE -->

        <div class="form-group full">

          <label for="title">
            समाचार शीर्षक *
          </label>

          <input
            type="text"
            id="title"
            placeholder="समाचारक शीर्षक लिखू"
            required
          >

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

          <label for="category">
            श्रेणी
          </label>

          <select id="category">

            <option value="">
              श्रेणी चुनू
            </option>

          </select>

        </div>


        <!-- STATUS -->

        <div class="form-group">

          <label for="status">
            स्थिति
          </label>

          <select id="status">

            <option value="draft">
              Draft
            </option>

            <option value="published">
              Publish
            </option>

          </select>

        </div>


        <!-- SUMMARY -->

        <div class="form-group full">

          <label for="summary">
            संक्षिप्त समाचार
          </label>

          <textarea
            id="summary"
            placeholder="समाचारक छोट विवरण लिखू"
          ></textarea>

        </div>


        <!-- CONTENT -->

        <div class="form-group full">

          <label for="content">
            पूरा समाचार *
          </label>

          <textarea
            id="content"
            placeholder="पूरा समाचार एतय लिखू..."
            required
          ></textarea>

        </div>


        <!-- IMAGE -->

        <div class="form-group full">

          <label for="imageUrl">
            Photo URL
          </label>

          <input
            type="url"
            id="imageUrl"
            placeholder="https://example.com/photo.jpg"
          >

        </div>


        <!-- SEO TITLE -->

        <div class="form-group">

          <label for="seoTitle">
            SEO Title
          </label>

          <input
            type="text"
            id="seoTitle"
            placeholder="SEO title"
          >

        </div>


        <!-- SEO DESCRIPTION -->

        <div class="form-group">

          <label for="seoDescription">
            SEO Description
          </label>

          <input
            type="text"
            id="seoDescription"
            placeholder="SEO description"
          >

        </div>


        <!-- FEATURED -->

        <div class="form-group">

          <label for="featured">
            Featured
          </label>

          <select id="featured">

            <option value="0">
              नहि
            </option>

            <option value="1">
              हँ
            </option>

          </select>

        </div>

      </div>


      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
        >
          Save News
        </button>

        <button
          type="button"
          class="btn btn-light"
          id="cancelNewsButton"
        >
          Cancel
        </button>

      </div>

    </form>

  </section>


  <!-- =====================================================
       NEWS LIST
  ====================================================== -->

  <section class="panel">

    <div class="panel-title">

      <h3>
        समाचार सूची
      </h3>

      <select
        id="newsFilter"
        class="news-filter"
      >

        <option value="all">
          सभ समाचार
        </option>

        <option value="published">
          Published
        </option>

        <option value="draft">
          Draft
        </option>

      </select>

    </div>


    <div
      id="newsTable"
      class="loading"
    >
      समाचार लोड भ' रहल अछि...
    </div>

  </section>


  <!-- =====================================================
       CATEGORY MANAGEMENT
       
       IMPORTANT:
       एहि section में कोनो FORM नहि अछि।
  ====================================================== -->

  <section class="panel">

    <div class="panel-title">

      <h3>
        श्रेणी प्रबंधन
      </h3>

    </div>


    <div class="category-add">


      <div>

        <label for="categoryName">
          श्रेणी नाम
        </label>

        <input
          type="text"
          id="categoryName"
          placeholder="जैसे: मिथिला"
        >

      </div>


      <div>

        <label for="categoryDescription">
          विवरण
        </label>

        <input
          type="text"
          id="categoryDescription"
          placeholder="श्रेणीक विवरण"
        >

      </div>


      <div>

        <button
          type="button"
          class="btn btn-primary"
          id="addCategoryButton"
        >
          + श्रेणी जोड़ू
        </button>

      </div>

    </div>


    <div
      id="categoryMessage"
      class="message"
    ></div>


    <div
      id="categoryList"
      class="category-list"
    >
      <div class="loading">
        श्रेणी लोड भ' रहल अछि...
      </div>
    </div>

  </section>


</main>


<script>


// =====================================================
// GLOBAL
// =====================================================

let categories = [];


// =====================================================
// DOM READY
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  startDashboard
);


// =====================================================
// START
// =====================================================

async function startDashboard() {

  const loggedIn =
    await checkLogin();

  if (!loggedIn) {
    return;
  }


  bindEvents();


  await loadCategories();

  await loadNews();

}


// =====================================================
// BIND EVENTS
//
// IMPORTANT:
// Category button केवल addCategory() call करत।
// News form केवल saveNews() call करत।
// दुनू एक-दोसर सँ अलग अछि।
// =====================================================

function bindEvents() {


  // NEW NEWS

  document
    .getElementById(
      "newNewsButton"
    )
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();
        event.stopPropagation();

        newNews();

      }
    );


  // CLOSE EDITOR

  document
    .getElementById(
      "closeEditorButton"
    )
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();
        event.stopPropagation();

        closeEditor();

      }
    );


  // CANCEL NEWS

  document
    .getElementById(
      "cancelNewsButton"
    )
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();
        event.stopPropagation();

        closeEditor();

      }
    );


  // NEWS FILTER

  document
    .getElementById(
      "newsFilter"
    )
    .addEventListener(
      "change",
      function() {

        loadNews();

      }
    );


  // NEWS FORM

  document
    .getElementById(
      "newsForm"
    )
    .addEventListener(
      "submit",
      saveNews
    );


  // CATEGORY BUTTON

  document
    .getElementById(
      "addCategoryButton"
    )
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();
        event.stopPropagation();

        addCategory();

      }
    );


  // LOGOUT

  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        logout();

      }
    );

}


// =====================================================
// CHECK LOGIN
// =====================================================

async function checkLogin() {

  try {

    const response =
      await fetch(
        "/api/login",
        {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      window.location.href =
        "/admin.html";

      return false;

    }


    const adminName =
      document.getElementById(
        "adminName"
      );


    adminName.textContent =
      data.user.name +
      " (" +
      data.user.role +
      ")";


    return true;


  } catch (error) {

    console.error(
      "LOGIN CHECK ERROR:",
      error
    );


    window.location.href =
      "/admin.html";

    return false;

  }

}


// =====================================================
// LOAD CATEGORIES
// =====================================================

async function loadCategories() {

  try {

    const response =
      await fetch(
        "/api/categories",
        {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    console.log(
      "CATEGORY GET:",
      data
    );


    if (!data.success) {

      throw new Error(
        data.error ||
        "Category loading failed"
      );

    }


    categories =
      data.categories || [];


    // COUNT

    document
      .getElementById(
        "totalCategories"
      )
      .textContent =
      categories.length;


    // DROPDOWN

    const select =
      document.getElementById(
        "category"
      );


    select.innerHTML =
      `
        <option value="">
          श्रेणी चुनू
        </option>
      `;


    categories.forEach(
      category => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          category.id;


        option.textContent =
          category.name;


        select.appendChild(
          option
        );

      }
    );


    renderCategories();


  } catch (error) {

    console.error(
      "LOAD CATEGORY ERROR:",
      error
    );


    document
      .getElementById(
        "categoryList"
      )
      .innerHTML =
      `
        <div class="empty">
          श्रेणी लोड नहि भ' सकल।
          <br>
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

  }

}


// =====================================================
// ADD CATEGORY
// =====================================================

async function addCategory() {

  console.log(
    "ADD CATEGORY CLICKED"
  );


  const name =
    document
      .getElementById(
        "categoryName"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "categoryDescription"
      )
      .value
      .trim();


  if (!name) {

    showCategoryMessage(
      "श्रेणी नाम लिखू।",
      "error"
    );

    return;

  }


  try {

    const response =
      await fetch(
        "/api/categories",
        {
          method: "POST",

          credentials:
            "same-origin",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              name:
                name,

              description:
                description

            })
        }
      );


    const data =
      await response.json();


    console.log(
      "CATEGORY POST:",
      data
    );


    if (!data.success) {

      showCategoryMessage(
        data.error ||
        "श्रेणी जोड़ल नहि गेल।",
        "error"
      );

      return;

    }


    document
      .getElementById(
        "categoryName"
      )
      .value = "";


    document
      .getElementById(
        "categoryDescription"
      )
      .value = "";


    showCategoryMessage(
      "श्रेणी सफलतापूर्वक जोड़ल गेल।",
      "success"
    );


    await loadCategories();


  } catch (error) {

    console.error(
      "ADD CATEGORY ERROR:",
      error
    );


    showCategoryMessage(
      "Server error: " +
      error.message,
      "error"
    );

  }

}


// =====================================================
// DELETE CATEGORY
// =====================================================

async function deleteCategory(id) {

  const confirmed =
    confirm(
      "की अहाँ एहि श्रेणी के delete कर' चाहैत छी?"
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/categories?id=" +
        encodeURIComponent(id),
        {
          method: "DELETE",
          credentials:
            "same-origin"
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      showCategoryMessage(
        data.error ||
        "श्रेणी delete नहि भ' सकल।",
        "error"
      );

      return;

    }


    showCategoryMessage(
      "श्रेणी delete भ' गेल।",
      "success"
    );


    await loadCategories();


  } catch (error) {

    console.error(
      "DELETE CATEGORY ERROR:",
      error
    );


    showCategoryMessage(
      "Server error।",
      "error"
    );

  }

}


// =====================================================
// RENDER CATEGORIES
// =====================================================

function renderCategories() {

  const box =
    document.getElementById(
      "categoryList"
    );


  if (!categories.length) {

    box.innerHTML =
      `
        <div class="empty">
          एखन कोनो श्रेणी नहि अछि।
        </div>
      `;

    return;

  }


  box.innerHTML =
    categories
      .map(
        category => {

          return `
            <div class="category-item">

              <div>

                <div>

                  <span class="category-name">
                    ${escapeHtml(
                      category.name
                    )}
                  </span>

                  <span class="category-slug">
                    /${escapeHtml(
                      category.slug
                    )}
                  </span>

                </div>

                ${
                  category.description
                    ? `
                      <div class="category-description">
                        ${escapeHtml(
                          category.description
                        )}
                      </div>
                    `
                    : ""
                }

              </div>


              <button
                type="button"
                class="btn btn-danger"
                onclick="deleteCategory(${Number(category.id)})"
              >
                Delete
              </button>

            </div>
          `;

        }
      )
      .join("");

}

// =====================================================
// LOAD NEWS
// =====================================================

async function loadNews() {

  const filter =
    document
      .getElementById(
        "newsFilter"
      )
      .value;


  try {

    const response =
      await fetch(
        "/api/news?status=" +
        encodeURIComponent(
          filter
        ),
        {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    console.log(
      "NEWS GET:",
      data
    );


    if (!data.success) {

      throw new Error(
        data.error ||
        "News loading failed"
      );

    }


    renderNews(
      data.news || []
    );


    await updateStats();


  } catch (error) {

    console.error(
      "LOAD NEWS ERROR:",
      error
    );


    document
      .getElementById(
        "newsTable"
      )
      .innerHTML =
      `
        <div class="empty">
          समाचार लोड नहि भ' सकल।
          <br>
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

  }

}


// =====================================================
// UPDATE STATS
// =====================================================

async function updateStats() {

  try {

    const response =
      await fetch(
        "/api/news?status=all",
        {
          credentials:
            "same-origin",
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (!data.success) {
      return;
    }


    const all =
      data.news || [];


    const published =
      all.filter(
        item =>
          item.status ===
          "published"
      );


    const drafts =
      all.filter(
        item =>
          item.status ===
          "draft"
      );


    document
      .getElementById(
        "totalNews"
      )
      .textContent =
      all.length;


    document
      .getElementById(
        "publishedNews"
      )
      .textContent =
      published.length;


    document
      .getElementById(
        "draftNews"
      )
      .textContent =
      drafts.length;

  } catch (error) {

    console.error(
      "STATS ERROR:",
      error
    );

  }

}


// =====================================================
// RENDER NEWS
// =====================================================

function renderNews(
  news
) {

  const box =
    document.getElementById(
      "newsTable"
    );


  if (!news.length) {

    box.innerHTML =
      `
        <div class="empty">
          एखन कोनो समाचार नहि अछि।
        </div>
      `;

    return;

  }


  box.innerHTML =
    `
      <div class="table-wrap">

        <table class="news-table">

          <thead>

            <tr>

              <th>
                शीर्षक
              </th>

              <th>
                श्रेणी
              </th>

              <th>
                स्थिति
              </th>

              <th>
                Views
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>


          <tbody>

            ${
              news
                .map(
                  item => {

                    const statusClass =
                      item.status ===
                      "published"
                        ? "status-published"
                        : "status-draft";


                    return `
                      <tr>

                        <td>

                          <div class="news-title">
                            ${escapeHtml(
                              item.title
                            )}
                          </div>

                          <span class="news-date">
                            ${formatDate(
                              item.created_at
                            )}
                          </span>

                        </td>


                        <td>
                          ${escapeHtml(
                            item.category_name ||
                            "-"
                          )}
                        </td>


                        <td>

                          <span
                            class="status ${statusClass}"
                          >
                            ${escapeHtml(
                              item.status
                            )}
                          </span>

                        </td>


                        <td>
                          ${Number(
                            item.views || 0
                          )}
                        </td>


                        <td>

                          <div class="action-buttons">

                            <button
                              type="button"
                              class="btn btn-secondary"
                              onclick="editNews(${Number(item.id)})"
                            >
                              Edit
                            </button>

                            <button
                              type="button"
                              class="btn btn-danger"
                              onclick="deleteNews(${Number(item.id)})"
                            >
                              Delete
                            </button>

                          </div>

                        </td>

                      </tr>
                    `;

                  }
                )
                .join("")
            }

          </tbody>

        </table>

      </div>
    `;

}

) {

        {
          credentials:
            "same-origin",
          cache: "no-store"
        }
      );

    if (!data.success) {

      );

      return;

    }


    const news =
      data.news;


    document
      .getElementById(
        "newsId"
      )

    document
      .getElementById(
        "title"
      )

    document
      .getElementById(
        "summary"
      )
      .value =
      news.summary || "";


    document
      .getElementById(
        "content"
      )
      .value =
      news.content || "";


    document
      .getElementById(
        "imageUrl"
      )
      .value =
      news.image_url || "";


    document
      .getElementById(
        "category"
      )
      .value =
      news.category_id || "";


    document
      .getElementById(
        "status"
      )
      .value =
      news.status || "draft";


    document
      .getElementById(
        "featured"
      )
      .value =
      news.featured
        ? "1"
        : "0";


    document
      .getElementById(
        "seoTitle"
      )
      .value =
      news.seo_title || "";


    document
      .getElementById(
        "seoDescription"
      )
      .value =
      news.seo_description || "";


    document
      .getElementById(
        "editorTitle"
      )
      .textContent =
      "समाचार Edit करू";


    document
      .getElementById(
        "editorPanel"
      )
      .classList
      .remove(
        "hidden"
      );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  } catch (error) {

    console.error(

    );


    alert(
      "समाचार लोड नहि भ' सकल।"
    );

  }

}


// =====================================================
// SAVE NEWS
// =====================================================

async function saveNews(
  event
) {

  event.preventDefault();
  event.stopPropagation();


  const id =
    document
      .getElementById(
        "newsId"
      )
      .value;


  const title =
    document
      .getElementById(
        "title"
      )
      .value
      .trim();


  const summary =
    document
      .getElementById(
        "summary"
      )
      .value
      .trim();


  const content =
    document
      .getElementById(
        "content"
      )
      .value
      .trim();


  const imageUrl =
    document
      .getElementById(
        "imageUrl"
      )
      .value
      .trim();


  const categoryValue =
    document
      .getElementById(
        "category"
      )
      .value;


  const status =
    document
      .getElementById(
        "status"
      )
      .value;


  const featured =
    document
      .getElementById(
        "featured"
      )
      .value ===
      "1";


  const seoTitle =
    document
      .getElementById(
        "seoTitle"
      )
      .value
      .trim();


  const seoDescription =
    document
      .getElementById(
        "seoDescription"
      )
      .value
      .trim();


  if (
    !title ||
    !content
  ) {

    showEditorMessage(
      "शीर्षक आ समाचार जरूरी अछि।",
      "error"
    );

    return;

  }


  const body = {

    title:
      title,

    summary:
      summary,

    content:
      content,

    image_url:
      imageUrl,

    category_id:
      categoryValue
        ? Number(
            categoryValue
          )
        : null,

    status:
      status,

    featured:
      featured,

    seo_title:
      seoTitle,

    seo_description:
      seoDescription

  };


  try {

    const url =
      id
        ? "/api/news?id=" +
          encodeURIComponent(id)
        : "/api/news";


    const method =
      id
        ? "PUT"
        : "POST";


    const response =
      await fetch(
        url,
        {
          method:
            method,

          credentials:
            "same-origin",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    const data =
      await response.json();


    console.log(
      "NEWS SAVE:",
      data
    );


    if (!data.success) {

      showEditorMessage(
        data.error ||
        "समाचार save नहि भ' सकल।",
        "error"
      );

      return;

    }


    showEditorMessage(
      data.message ||
      "समाचार save भ' गेल।",
      "success"
    );


    await loadNews();


    setTimeout(
      function() {

        closeEditor();

      },
      700
    );


  } catch (error) {

    console.error(
      "SAVE NEWS ERROR:",
      error
    );


    showEditorMessage(
      "Server error: " +
      error.message,
      "error"
    );

  }

}


// =====================================================
// DELETE NEWS
// =====================================================

async function deleteNews(
  id
) {

  if (
    !confirm(
      "की अहाँ एहि समाचार के delete कर' चाहैत छी?"
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/news?id=" +
        encodeURIComponent(id),
        {
          method: "DELETE",
          credentials:
            "same-origin"
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      alert(
        data.error ||
        "समाचार delete नहि भ' सकल।"
      );

      return;

    }


    await loadNews();


  } catch (error) {

    console.error(
      "DELETE NEWS ERROR:",
      error
    );


    alert(
      "Server error।"
    );

  }

}

// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// =====================================================
// DATE FORMAT
// =====================================================

function formatDate(
  value
) {

  if (!value) {
    return "";
  }


  try {

    return new Date(
      value
    ).toLocaleString(
      "hi-IN",
      {
        dateStyle:
          "medium",
        timeStyle:
          "short"
      }
    );

  } catch {

    return String(
      value
    );

  }

}
