<!DOCTYPE html>
<html lang="mai">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - मैथिली समाचार</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    .dashboard-wrap {
      padding: 25px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .topbar h2,
    .topbar h3 {
      margin: 0;
    }

    .btn {
      border: 0;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      background: #8b0000;
      color: white;
    }

    .btn-secondary {
      background: #555;
      color: white;
    }

    .btn-danger {
      background: #b00020;
      color: white;
    }

    .btn-light {
      background: #eee;
      color: #222;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .panel h3 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .summary-input {
      min-height: 90px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .news-table {
      width: 100%;
      border-collapse: collapse;
    }

    .news-table th,
    .news-table td {
      padding: 12px 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
    }

    .news-table th {
      background: #f5f5f5;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    .status-published {
      background: #e3f5e8;
      color: #176b2c;
    }

    .status-draft {
      background: #fff2d6;
      color: #8a5a00;
    }

    .category-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .category-name {
      font-weight: bold;
    }

    .category-slug {
      color: #777;
      font-size: 13px;
      margin-left: 5px;
    }

    .message {
      margin: 12px 0;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .message.success {
      display: block;
      background: #e8f7ed;
      color: #176b2c;
    }

    .message.error {
      display: block;
      background: #fde8e8;
      color: #a00000;
    }

    .hidden {
      display: none !important;
    }

    .category-add-box {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .category-add-box {
        grid-template-columns: 1fr;
      }

      .news-table {
        display: block;
        overflow-x: auto;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header class="dashboard-header">

  <div class="container">

    <div>
      <h1>मैथिली समाचार</h1>
      <small id="adminName">
        Admin Dashboard
      </small>
    </div>

    <button
      type="button"
      class="btn btn-light"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</header>


<main class="container dashboard-wrap">


  <!-- ======================================
       HEADER
  ======================================= -->

  <div class="topbar">

    <div>
      <h2>Admin Dashboard</h2>
      <p>समाचार आ श्रेणी प्रबंधन</p>
    </div>

    <button
      type="button"
      class="btn btn-primary"
      onclick="newNews()"
    >
      + नवीन समाचार
    </button>

  </div>


  <!-- ======================================
       STATISTICS
  ======================================= -->

  <section class="stats">

    <div class="stat">
      कुल समाचार
      <strong id="totalNews">0</strong>
    </div>

    <div class="stat">
      प्रकाशित
      <strong id="publishedNews">0</strong>
    </div>

    <div class="stat">
      Draft
      <strong id="draftNews">0</strong>
    </div>

    <div class="stat">
      श्रेणी
      <strong id="totalCategories">0</strong>
    </div>

  </section>


  <!-- ======================================
       NEWS EDITOR
  ======================================= -->

  <section
    class="panel hidden"
    id="editorPanel"
  >

    <div class="topbar">

      <h3 id="editorTitle">
        नवीन समाचार
      </h3>

      <button
        type="button"
        class="btn btn-light"
        onclick="closeEditor()"
      >
        ✕ बन्द करू
      </button>

    </div>


    <div
      id="editorMessage"
      class="message"
    ></div>


    <form id="newsForm">

      <input
        type="hidden"
        id="newsId"
      >


      <div class="form-grid">


        <!-- TITLE -->

        <div class="form-group full">

          <label for="title">
            समाचार शीर्षक *
          </label>

          <input
            id="title"
            type="text"
            required
            placeholder="समाचारक शीर्षक लिखू"
          >

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

          <label for="category">
            श्रेणी
          </label>

          <select id="category">

            <option value="">
              श्रेणी चुनू
            </option>

          </select>

        </div>


        <!-- STATUS -->

        <div class="form-group">

          <label for="status">
            स्थिति
          </label>

          <select id="status">

            <option value="draft">
              Draft
            </option>

            <option value="published">
              Publish
            </option>

          </select>

        </div>


        <!-- SUMMARY -->

        <div class="form-group full">

          <label for="summary">
            संक्षिप्त समाचार
          </label>

          <textarea
            id="summary"
            class="summary-input"
            placeholder="समाचारक छोट विवरण"
          ></textarea>

        </div>


        <!-- CONTENT -->

        <div class="form-group full">

          <label for="content">
            पूरा समाचार *
          </label>

          <textarea
            id="content"
            required
            placeholder="पूरा समाचार एतय लिखू..."
          ></textarea>

        </div>


        <!-- IMAGE -->

        <div class="form-group full">

          <label for="imageUrl">
            Photo URL
          </label>

          <input
            id="imageUrl"
            type="url"
            placeholder="https://example.com/photo.jpg"
          >

        </div>


        <!-- SEO TITLE -->

        <div class="form-group">

          <label for="seoTitle">
            SEO Title
          </label>

          <input
            id="seoTitle"
            type="text"
          >

        </div>


        <!-- SEO DESCRIPTION -->

        <div class="form-group">

          <label for="seoDescription">
            SEO Description
          </label>

          <input
            id="seoDescription"
            type="text"
          >

        </div>


        <!-- FEATURED -->

        <div class="form-group">

          <label for="featured">
            Featured News
          </label>

          <select id="featured">

            <option value="0">
              नहि
            </option>

            <option value="1">
              हँ
            </option>

          </select>

        </div>

      </div>


      <div class="actions">

        <button
          type="submit"
          class="btn btn-primary"
        >
          Save News
        </button>

        <button
          type="button"
          class="btn btn-light"
          onclick="closeEditor()"
        >
          Cancel
        </button>

      </div>

    </form>

  </section>


  <!-- ======================================
       NEWS LIST
  ======================================= -->

  <section class="panel">

    <div class="topbar">

      <h3>
        समाचार सूची
      </h3>

      <select
        id="newsFilter"
        onchange="loadNews()"
        style="max-width:180px"
      >

        <option value="all">
          सभ समाचार
        </option>

        <option value="published">
          Published
        </option>

        <option value="draft">
          Draft
        </option>

      </select>

    </div>


    <div id="newsTable">
      समाचार लोड भ' रहल अछि...
    </div>

  </section>


  <!-- ======================================
       CATEGORY MANAGEMENT
  ======================================= -->

  <section class="panel">

    <h3>
      श्रेणी प्रबंधन
    </h3>


    <!-- IMPORTANT:
         ई FORM नहि अछि।
         एहि कारण News form trigger नहि होयत।
    -->

    <div class="category-add-box">

      <div>

        <label for="categoryName">
          श्रेणी नाम
        </label>

        <input
          id="categoryName"
          type="text"
          placeholder="जैसे: मिथिला"
        >

      </div>


      <div>

        <label for="categoryDescription">
          विवरण
        </label>

        <input
          id="categoryDescription"
          type="text"
          placeholder="श्रेणीक विवरण"
        >

      </div>


      <div>

        <button
  id="addCategoryButton"
  type="button"
  class="btn btn-primary"
>
  + श्रेणी जोड़ू
</button>
      
      </div>

    </div>


    <div
      id="categoryMessage"
      class="message"
    ></div>


    <div
      id="categoryList"
      style="margin-top:20px"
    >
      श्रेणी लोड भ' रहल अछि...
    </div>

  </section>

</main>


<script>


// ======================================================
// GLOBAL
// ======================================================

let categories = [];


// ======================================================
// AUTH CHECK
// ======================================================

async function checkLogin() {

  try {

    const response =
      await fetch("/api/login", {
        method: "GET",
        credentials: "same-origin"
      });

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {

      window.location.href =
        "/admin.html";

      return false;
    }


    document
      .getElementById("adminName")
      .textContent =
        data.user.name +
        " (" +
        data.user.role +
        ")";


    return true;

  } catch (error) {

    console.error(error);

    window.location.href =
      "/admin.html";

    return false;
  }
}


// ======================================================
// START DASHBOARD
// ======================================================

async function loadDashboard() {

  const loggedIn =
    await checkLogin();

  if (!loggedIn) {
    return;
  }


  await loadCategories();

  await loadNews();
}


// ======================================================
// LOAD CATEGORIES
// ======================================================

async function loadCategories() {

  try {

    const response =
      await fetch(
        "/api/categories"
      );

    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Category loading failed"
      );

    }


    categories =
      data.categories || [];


    document
      .getElementById("totalCategories")
      .textContent =
        categories.length;


    // NEWS CATEGORY DROPDOWN

    const select =
      document
        .getElementById("category");


    select.innerHTML =
      `
        <option value="">
          श्रेणी चुनू
        </option>
      `;


    categories.forEach(category => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        category.id;

      option.textContent =
        category.name;

      select.appendChild(
        option
      );

    });


    renderCategories();


  } catch (error) {

    console.error(
      "CATEGORY ERROR:",
      error
    );


    document
      .getElementById("categoryList")
      .innerHTML =
        `
          <p>
            श्रेणी लोड नहि भ' सकल।
          </p>
        `;

  }
}


// ======================================================
// RENDER CATEGORY LIST
// ======================================================

function renderCategories() {

  const box =
    document
      .getElementById(
        "categoryList"
      );


  if (!categories.length) {

    box.innerHTML =
      `
        <p>
          एखन कोनो श्रेणी नहि अछि।
        </p>
      `;

    return;
  }


  box.innerHTML =
    categories
      .map(category => {

        return `
          <div class="category-row">

            <div>

              <span class="category-name">
                ${escapeHtml(
                  category.name
                )}
              </span>

              <span class="category-slug">
                /${escapeHtml(
                  category.slug
                )}
              </span>

              ${
                category.description
                  ? `
                    <div>
                      <small>
                        ${escapeHtml(
                          category.description
                        )}
                      </small>
                    </div>
                  `
                  : ""
              }

            </div>


            <button
              type="button"
              class="btn btn-danger"
              onclick="deleteCategory(${category.id})"
            >
              Delete
            </button>

          </div>
        `;

      })
      .join("");

}


// ======================================================
// ADD CATEGORY
// ======================================================

async function addCategory(event) {

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const name =
    document.getElementById("categoryName").value.trim();

  const description =
    document.getElementById("categoryDescription").value.trim();

  if (!name) {
    showCategoryMessage(
      "कृपया श्रेणी नाम लिखू।",
      "error"
    );
    return;
  }

  try {

    const response = await fetch("/api/categories", {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: name,
        description: description
      })
    });

    const data = await response.json();

    console.log("CATEGORY RESPONSE:", data);

    if (!data.success) {
      showCategoryMessage(
        data.error || "श्रेणी जोड़ल नहि गेल।",
        "error"
      );
      return;
    }

    document.getElementById("categoryName").value = "";
    document.getElementById("categoryDescription").value = "";

    showCategoryMessage(
      "श्रेणी सफलतापूर्वक जोड़ल गेल।",
      "success"
    );

    await loadCategories();

  } catch (error) {

    console.error("CATEGORY ERROR:", error);

    showCategoryMessage(
      "Server error: श्रेणी जोड़ल नहि जा सकल।",
      "error"
    );
  }
}
    document
      .getElementById(
        "categoryName"
      )
      .value = "";


    document
      .getElementById(
        "categoryDescription"
      )
      .value = "";


    showCategoryMessage(
      "श्रेणी सफलतापूर्वक जोड़ल गेल।",
      "success"
    );


    await loadCategories();


  } catch (error) {

    console.error(
      "ADD CATEGORY ERROR:",
      error
    );


    showCategoryMessage(
      "Server error: श्रेणी जोड़ल नहि जा सकल।",
      "error"
    );

  }
}


// ======================================================
// DELETE CATEGORY
// ======================================================

async function deleteCategory(id) {

  const ok =
    confirm(
      "की अहाँ एहि श्रेणी के delete कर' चाहैत छी?"
    );


  if (!ok) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/categories?id=" +
        encodeURIComponent(id),
        {
          method: "DELETE",
          credentials:
            "same-origin"
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      showCategoryMessage(
        data.error ||
        "श्रेणी delete नहि भ' सकल।",
        "error"
      );

      return;
    }


    showCategoryMessage(
      "श्रेणी delete भ' गेल।",
      "success"
    );


    await loadCategories();


  } catch (error) {

    console.error(
      "DELETE CATEGORY ERROR:",
      error
    );


    showCategoryMessage(
      "Server error।",
      "error"
    );

  }
}


// ======================================================
// CATEGORY MESSAGE
// ======================================================

function showCategoryMessage(
  text,
  type
) {

  const box =
    document
      .getElementById(
        "categoryMessage"
      );


  box.textContent =
    text;


  box.className =
    "message " +
    type;


  setTimeout(() => {

    box.className =
      "message";

  }, 4000);

}


// ======================================================
// LOAD NEWS
// ======================================================

async function loadNews() {

  try {

    const filter =
      document
        .getElementById(
          "newsFilter"
        )
        .value;


    const response =
      await fetch(
        "/api/news?status=" +
        encodeURIComponent(
          filter
        )
      );


    const data =
      await response.json();


    if (!data.success) {

      document
        .getElementById(
          "newsTable"
        )
        .innerHTML =
          `
            <p>
              ${escapeHtml(
                data.error
              )}
            </p>
          `;

      return;
    }


    const news =
      data.news || [];


    renderNews(
      news
    );


    await updateStats();


  } catch (error) {

    console.error(
      "NEWS ERROR:",
      error
    );


    document
      .getElementById(
        "newsTable"
      )
      .innerHTML =
        `
          <p>
            समाचार लोड नहि भ' सकल।
          </p>
        `;

  }
}


// ======================================================
// UPDATE STATS
// ======================================================

async function updateStats() {

  try {

    const response =
      await fetch(
        "/api/news?status=all"
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {
      return;
    }


    const all =
      data.news || [];


    const published =
      all.filter(
        item =>
          item.status ===
          "published"
      );


    const drafts =
      all.filter(
        item =>
          item.status ===
          "draft"
      );


    document
      .getElementById(
        "totalNews"
      )
      .textContent =
        all.length;


    document
      .getElementById(
        "publishedNews"
      )
      .textContent =
        published.length;


    document
      .getElementById(
        "draftNews"
      )
      .textContent =
        drafts.length;

  } catch (error) {

    console.error(
      "STATS ERROR:",
      error
    );

  }
}


// ======================================================
// RENDER NEWS
// ======================================================

function renderNews(
  news
) {

  const box =
    document
      .getElementById(
        "newsTable"
      );


  if (!news.length) {

    box.innerHTML =
      `
        <p>
          एखन कोनो समाचार नहि अछि।
        </p>
      `;

    return;
  }


  box.innerHTML =
    `
      <div
        style="overflow-x:auto"
      >

        <table
          class="news-table"
        >

          <thead>

            <tr>

              <th>
                शीर्षक
              </th>

              <th>
                श्रेणी
              </th>

              <th>
                स्थिति
              </th>

              <th>
                Views
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>


          <tbody>

            ${
              news
                .map(item => {

                  return `
                    <tr>

                      <td>

                        <strong>
                          ${escapeHtml(
                            item.title
                          )}
                        </strong>

                        <br>

                        <small>
                          ${formatDate(
                            item.created_at
                          )}
                        </small>

                      </td>


                      <td>
                        ${escapeHtml(
                          item.category_name ||
                          "-"
                        )}
                      </td>


                      <td>

                        <span
                          class="status ${
                            item.status ===
                            "published"

                              ? "status-published"

                              : "status-draft"
                          }"
                        >
                          ${escapeHtml(
                            item.status
                          )}
                        </span>

                      </td>


                      <td>
                        ${Number(
                          item.views || 0
                        )}
                      </td>


                      <td>

                        <div
                          class="actions"
                        >

                          <button
                            type="button"
                            class="btn btn-secondary"
                            onclick="editNews(${item.id})"
                          >
                            Edit
                          </button>


                          <button
                            type="button"
                            class="btn btn-danger"
                            onclick="deleteNews(${item.id})"
                          >
                            Delete
                          </button>

                        </div>

                      </td>

                    </tr>
                  `;

                })
                .join("")
            }

          </tbody>

        </table>

      </div>
    `;

}


// ======================================================
// NEW NEWS
// ======================================================

function newNews() {

  const form =
    document
      .getElementById(
        "newsForm"
      );


  form.reset();


  document
    .getElementById(
      "newsId"
    )
    .value = "";


  document
    .getElementById(
      "editorTitle"
    )
    .textContent =
      "नवीन समाचार";


  document
    .getElementById(
      "editorPanel"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "editorMessage"
    )
    .className =
      "message";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

      alert(

      return;
    }


    const news =
      data.news;


    document
      .getElementById(
        "newsId"
      )
      .value =
        news.id;


    document
      .getElementById(
        "title"
      )
      .value =
        news.title || "";


    document
      .getElementById(
        "summary"
      )
      .value =
        news.summary || "";


    document
      .getElementById(
        "content"
      )
      .value =
        news.content || "";


    document
      .getElementById(
        "imageUrl"
      )
      .value =
        news.image_url || "";


    document
      .getElementById(
        "category"
      )
      .value =
        news.category_id || "";


    document
      .getElementById(
        "status"
      )

    document
      .getElementById(
        "featured"
      )
      .value =

          ? "1"
          : "0";


    document
      .getElementById(
        "seoTitle"
      )
      .value =
        news.seo_title || "";


    document
      .getElementById(
        "seoDescription"
      )

        news.seo_description || "";

      .getElementById(
        "editorTitle"

// ======================================================
// SAVE NEWS
// ======================================================

document
  .getElementById(
    "newsForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const id =
        document
          .getElementById(
            "newsId"
          )
          .value;


      const title =
        document
          .getElementById(
            "title"
          )
          .value
          .trim();


      const summary =
        document
          .getElementById(
            "summary"
          )
          .value
          .trim();


      const content =
        document
          .getElementById(
            "content"
          )
          .value
          .trim();


      const imageUrl =
        document
          .getElementById(
            "imageUrl"
          )
          .value
          .trim();


      const categoryValue =
        document
          .getElementById(
            "category"
          )
          .value;


      const status =
        document
          .getElementById(
            "status"
          )
          .value;


      const featured =
        document
          .getElementById(
            "featured"
          )
          .value ===
          "1";


      const seoTitle =
        document
          .getElementById(
            "seoTitle"
          )
          .value
          .trim();


      const seoDescription =
        document
          .getElementById(
            "seoDescription"
          )
          .value
          .trim();


      if (
        !title ||
        !content
      ) {

        showEditorMessage(
          "शीर्षक आ समाचार जरूरी अछि।",
          "error"
        );

        return;
      }


      const body = {

        title:
          title,

        summary:
          summary,

        content:
          content,

        image_url:
          imageUrl,

        category_id:
          categoryValue
            ? Number(
                categoryValue
              )
            : null,

        status:
          status,

        featured:
          featured,

        seo_title:
          seoTitle,

        seo_description:
          seoDescription

      };


      try {

        const response =
          await fetch(
            id
              ? "/api/news?id=" +
                encodeURIComponent(id)

              : "/api/news",
            {
              method:
                id
                  ? "PUT"
                  : "POST",

              credentials:
                "same-origin",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  body
                )
            }
          );


        const data =
          await response.json();


        if (!data.success) {

          showEditorMessage(
            data.error ||
            "समाचार save नहि भ' सकल।",
            "error"
          );

          return;
        }


        showEditorMessage(
          data.message ||
          "समाचार save भ' गेल।",
          "success"
        );


        await loadNews();


        setTimeout(
          closeEditor,
          700
        );


      } catch (error) {

        console.error(
          error
        );


        showEditorMessage(
          "Server error।",
          "error"
        );

      }

    }
  );


// ======================================================
// DELETE NEWS
// ======================================================

async function deleteNews(
  id
) {

  if (
    !confirm(
      "की अहाँ एहि समाचार के delete कर' चाहैत छी?"
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/news?id=" +
        encodeURIComponent(id),
        {
          method: "DELETE",
          credentials:
            "same-origin"
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      alert(
        data.error ||
        "Delete नहि भ' सकल।"
      );

      return;
    }


    await loadNews();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Server error।"
    );

  }
}


// ======================================================
// CLOSE EDITOR
// ======================================================

function closeEditor() {

  document
    .getElementById(
      "editorPanel"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "newsForm"
    )
    .reset();


  document
    .getElementById(
      "newsId"
    )
    .value = "";


  document
    .getElementById(
      "editorMessage"
    )
    .className =
      "message";

}


// ======================================================
// EDITOR MESSAGE
// ======================================================

function showEditorMessage(
  text,
  type
) {

  const box =
    document
      .getElementById(
        "editorMessage"
      );


  box.textContent =
    text;


  box.className =
    "message " +
    type;


  setTimeout(
    () => {
      box.className =
        "message";
    },
    4000
  );

}

// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// ======================================================
// DATE
// ======================================================

function formatDate(
  value
) {

  if (!value) {
    return "";
  }


  try {

    return new Date(
      value
    ).toLocaleString(
      "hi-IN",
      {
        dateStyle:
          "medium",
        timeStyle:
          "short"
      }
    );

  } catch {

    return value;

  }

}
