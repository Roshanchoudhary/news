<script>

  /* =========================================================
   PUBLIC COMMENTS
========================================================= */

async function loadPublicComments(newsId){

  const container =
    document.getElementById(
      "publicCommentsList"
    );


  if(!container){

    return;

  }


  if(!newsId){

    container.innerHTML = `
      <div
        style="
          color:#888;
          font-size:12px;
        "
      >
        टिप्पणी उपलब्ध नहि अछि।
      </div>
    `;

    return;

  }


  try{

    const response =
      await fetch(
        "/api/comments?news_id=" +
        encodeURIComponent(
          newsId
        ),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      data.success !== true
    ){

      throw new Error(
        data.error ||
        "Comment load नहि भ' सकल"
      );

    }


    const comments =
      Array.isArray(
        data.comments
      )
        ? data.comments
        : [];


    if(!comments.length){

      container.innerHTML = `
        <div
          style="
            padding:18px;
            background:#fafafa;
            border-radius:8px;
            color:#888;
            font-size:12px;
            text-align:center;
          "
        >
          एखन धरि कोनो स्वीकृत टिप्पणी नहि अछि।
        </div>
      `;

      return;

    }


    container.innerHTML =
      comments
        .map(
          comment => `

            <div
              style="
                padding:16px 0;
                border-bottom:1px solid #eee;
              "
            >

              <div
                style="
                  display:flex;
                  justify-content:space-between;
                  gap:10px;
                  margin-bottom:7px;
                "
              >

                <strong
                  style="
                    font-size:13px;
                  "
                >
                  ${escapeHtml(
                    comment.name ||
                    "Anonymous"
                  )}
                </strong>


                <span
                  style="
                    color:#999;
                    font-size:10px;
                  "
                >
                  ${formatPublicCommentDate(
                    comment.created_at
                  )}
                </span>

              </div>


              <div
                style="
                  color:#444;
                  font-size:12px;
                  line-height:1.7;
                  white-space:pre-wrap;
                "
              >
                ${escapeHtml(
                  comment.comment ||
                  ""
                )}
              </div>

            </div>

          `
        )
        .join("");


  }catch(error){

    console.error(
      "PUBLIC COMMENTS ERROR:",
      error
    );


    container.innerHTML = `
      <div
        style="
          color:#b00000;
          font-size:11px;
        "
      >
        टिप्पणी लोड नहि भ' सकल।
      </div>
    `;

  }

}


/* =========================================================
   SUBMIT COMMENT
========================================================= */

async function submitPublicComment(
  event
){

  event.preventDefault();


  const form =
    document.getElementById(
      "publicCommentForm"
    );


  const button =
    document.getElementById(
      "commentSubmitButton"
    );


  const message =
    document.getElementById(
      "commentFormMessage"
    );


  /*
   * News ID:
   *
   * अगर आपके page में current news
   * variable "news" के नाम से है,
   * तो news.id इस्तेमाल होगा।
   */

  const newsId =
    window.currentNewsId ||
    loadPublicComments(
    window.newsId ||
    (
      typeof news !==
      "undefined"
        ? news?.id
        : null
    );


  if(!newsId){

    showCommentMessage(
      "समाचार ID नहि भेटल।",
      true
    );

    return;

  }


  const name =
    document.getElementById(
      "commentName"
    )?.value.trim();


  const email =
    document.getElementById(
      "commentEmail"
    )?.value.trim();


  const mobile =
    document.getElementById(
      "commentMobile"
    )?.value.trim();


  const comment =
    document.getElementById(
      "commentText"
    )?.value.trim();


  if(
    !name ||
    !email ||
    !mobile ||
    !comment
  ){

    showCommentMessage(
      "सभ field भरब जरूरी अछि।",
      true
    );

    return;

  }


  try{

    button.disabled =
      true;

    button.textContent =
      "भेजल जा रहल अछि...";


    const response =
      await fetch(
        "/api/comments",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify({

              news_id:
                Number(
                  newsId
                ),

              name,

              email,

              mobile,

              comment

            })
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      data.success !== true
    ){

      throw new Error(
        data.error ||
        "Comment भेजल नहि जा सकल।"
      );

    }


    /*
     * Form clear
     */

    form.reset();


    showCommentMessage(
      data.message ||
      "अहाँक टिप्पणी प्राप्त भ' गेल। Admin approval के बाद प्रकाशित होयत।",
      false
    );


  }catch(error){

    console.error(
      "SUBMIT COMMENT ERROR:",
      error
    );


    showCommentMessage(
      error.message ||
      "Comment भेजल नहि जा सकल।",
      true
    );


  }finally{

    button.disabled =
      false;

    button.textContent =
      "टिप्पणी भेजू";

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showCommentMessage(
  text,
  isError
){

  const message =
    document.getElementById(
      "commentFormMessage"
    );


  if(!message){

    return;

  }


  message.textContent =
    text;


  message.style.display =
    "block";


  message.style.background =
    isError
      ? "#fff0f0"
      : "#edf8ef";


  message.style.color =
    isError
      ? "#b00020"
      : "#176b2c";

}


/* =========================================================
   DATE
========================================================= */

function formatPublicCommentDate(
  value
){

  if(!value){

    return "";

  }


  const date =
    new Date(
      value
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return date.toLocaleDateString(
    "hi-IN",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}

/* =====================================================
   GET SLUG
===================================================== */

function getSlug(){

  const path =
    location.pathname
      .replace(
        /\/+$/,
        ""
      );


  const parts =
    path
      .split("/")
      .filter(Boolean);


  /*
     /news/example-slug
  */

  if(
    parts.length >= 2 &&
    parts[0] === "news"
  ){

    return decodeURIComponent(
      parts[1]
    );

  }


  /*
     Old URL support:
     /news.html?slug=example
  */

  const params =
    new URLSearchParams(
      location.search
    );


  return (
    params.get("slug") ||
    ""
  );

}


/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories(){

  try{

    const response =
      await fetch(
        "/api/categories?status=active",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !data.success
    ){
      return;
    }


    const nav =
      document.getElementById(
        "categoryNav"
      );


    (data.categories || [])
      .filter(
        category =>
          String(
            category.status ||
            "active"
          ).toLowerCase()
          ===
          "active"
      )
      .filter(
        category =>
          Number(
            category.menu_visible ??
            category.show_in_menu ??
            1
          ) === 1
      )
      .sort(
        (a,b) =>
          Number(
            a.menu_order || 0
          ) -
          Number(
            b.menu_order || 0
          )
      )
      .forEach(
        category => {

          if(
            !category.slug
          ){
            return;
          }


          const link =
            document.createElement(
              "a"
            );


          link.className =
            "nav-link";


          link.href =
            "/category/" +
            encodeURIComponent(
              category.slug
            );


          link.textContent =
            category.name;


          nav.appendChild(
            link
          );

        }
      );

  }catch(error){

    console.error(
      "CATEGORY ERROR:",
      error
    );

  }

}


/* =====================================================
   LOAD ARTICLE
===================================================== */

async function loadArticle(){

  const container =
    document.getElementById(
      "articleContainer"
    );


  const slug =
    getSlug();


  if(!slug){

    showError(
      "समाचार URL सही नहि अछि।"
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/news?slug=" +
        encodeURIComponent(
          slug
        ),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success ||
      !data.news
    ){

      throw new Error(
        data.error ||
        "समाचार नहि भेटल"
      );

    }


    const news =
      data.news;


    renderArticle(
      news
    );


    updateSEO(
      news
    );


  }catch(error){

    console.error(
      "ARTICLE ERROR:",
      error
    );


    showError(
      error.message ||
      "समाचार लोड नहि भ' सकल"
    );

  }

}


/* =====================================================
   RENDER ARTICLE
===================================================== */

function renderArticle(
  news
){

  const container =
    document.getElementById(
      "articleContainer"
    );


  const image =
    news.image_url

    ? `
      <img
        class="article-image"
        src="${escapeAttribute(
          news.image_url
        )}"
        alt="${escapeAttribute(
          news.title
        )}"
      >
    `

    : `
      <div class="no-image">
        मैथिली समाचार
      </div>
    `;


  const summary =
    news.summary ||
    "";


  const tags =
    Array.isArray(
      news.tags
    )
      ? news.tags
      : [];


  const tagsHtml =
    tags.length

      ? `
        <div class="tags">

          ${
            tags
              .map(
                tag => {

                  const slug =
                    tag.slug ||
                    tag.name ||
                    "";

                  const name =
                    tag.name ||
                    tag.slug ||
                    "";

                  return `
                    <a
                      class="tag"
                      href="/tag/${encodeURIComponent(
                        slug
                      )}"
                    >
                      #${escapeHtml(
                        name
                      )}
                    </a>
                  `;

                }
              )
              .join("")
          }

        </div>
      `

      : "";


  const categoryUrl =
    news.category_slug

      ? `
        <a
          href="/category/${encodeURIComponent(
            news.category_slug
          )}"
        >
          ${escapeHtml(
            news.category_name ||
            "समाचार"
          )}
        </a>
      `

      : `
        <span>
          ${escapeHtml(
            news.category_name ||
            "समाचार"
          )}
        </span>
      `;


  container.innerHTML =
    `

      <article class="article">

        <div class="breadcrumb">

          <a href="/">
            मुख्य पृष्ठ
          </a>

          <span>
            &nbsp;›&nbsp;
          </span>

          ${categoryUrl}

          <span>
            &nbsp;›&nbsp;
            समाचार
          </span>

        </div>


        <div class="category">
          ${escapeHtml(
            news.category_name ||
            "समाचार"
          )}
        </div>


        <h1 class="article-title">
          ${escapeHtml(
            news.title
          )}
        </h1>


        <div class="article-meta">

          <span>
            📅
            ${formatDate(
              news.published_at ||
              news.created_at
            )}
          </span>


          ${
            news.author_name

            ? `
              <span>
                ✍
                ${escapeHtml(
                  news.author_name
                )}
              </span>
            `

            : ""
          }


          <span>
            👁
            ${Number(
              news.views || 0
            )}
          </span>

        </div>


        ${image}


        ${
          summary

          ? `
            <div class="article-summary">
              ${escapeHtml(
                summary
              )}
            </div>
          `

          : ""
        }


        <div
          class="article-content"
        >
          ${sanitizeContent(
            news.content
          )}
        </div>


        ${tagsHtml}

      </article>

    `;

}


/* =====================================================
   SEO
===================================================== */

function updateSEO(
  news
){

  const title =
    String(
      news.seo_title ||
      news.title ||
      "मैथिली समाचार"
    );


  const description =
    String(
      news.seo_description ||
      news.summary ||
      makeExcerpt(
        news.content,
        155
      )
    );


  document.title =
    title +
    " | मैथिली समाचार";


  document
    .getElementById(
      "metaDescription"
    )
    .setAttribute(
      "content",
      description
    );


  /*
     Canonical URL
  */

  let canonical =
    document.querySelector(
      'link[rel="canonical"]'
    );


  if(!canonical){

    canonical =
      document.createElement(
        "link"
      );

    canonical.rel =
      "canonical";

    document.head.appendChild(
      canonical
    );

  }


  canonical.href =
    location.origin +
    "/news/" +
    encodeURIComponent(
      news.slug
    );

}


/* =====================================================
   CONTENT SANITIZER
===================================================== */

function sanitizeContent(
  content
){

  /*
    Content admin से आता अछि।
    Basic dangerous tags हटाओल जा रहल अछि।
  */

  return String(
    content || ""
  )
    .replace(
      /<script[\s\S]*?>[\s\S]*?<\/script>/gi,
      ""
    )
    .replace(
      /<iframe[\s\S]*?>[\s\S]*?<\/iframe>/gi,
      ""
    )
    .replace(
      /<object[\s\S]*?>[\s\S]*?<\/object>/gi,
      ""
    )
    .replace(
      /<embed[\s\S]*?>/gi,
      ""
    )
    .replace(
      /on\w+\s*=/gi,
      "data-blocked="
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
){

  document
    .getElementById(
      "articleContainer"
    )
    .innerHTML =
    `
      <div class="error">

        <h2>
          समाचार नहि भेटल
        </h2>

        <p>
          ${escapeHtml(
            message
          )}
        </p>

        <p>
          <a
            href="/"
            style="
              color:#8b0000;
              font-weight:bold;
            "
          >
            ← मुख्य पृष्ठ पर जाउ
          </a>
        </p>

      </div>
    `;

}


/* =====================================================
   EXCERPT
===================================================== */

function makeExcerpt(
  text,
  length
){

  const clean =
    String(
      text || ""
    )
      .replace(
        /<[^>]*>/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if(
    clean.length <= length
  ){

    return clean;

  }


  return (
    clean.substring(
      0,
      length
    ) +
    "..."
  );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
  value
){

  if(!value){
    return "";
  }


  try{

    return new Date(
      value
    ).toLocaleDateString(
      "hi-IN",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  }catch{

    return "";

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}
